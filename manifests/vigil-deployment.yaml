# ---------------------------------------------------------------------------
# Vigil-LLM — inbound prompt-injection & jailbreak scanner.
#
# Every untrusted MCP payload (tool descriptions, initialize instructions,
# fuzz/probe responses) is POSTed by the evaluator to
# http://vigil-service:5000/analyze BEFORE it reaches any LLM prompt. Vigil
# runs heuristic pattern matching, YARA signatures and transformer/embedding
# similarity classifiers and returns a verdict; a "blocked" verdict aborts
# the evaluation and marks the MCPEvaluationRun Failed with
# riskCategory=Malicious.
#
# Deployed in security-gateways (see occludra-deployment.yaml for the namespace
# rationale — the netbird sidecar needs CAP_NET_ADMIN). Namespace-wide ingress
# and egress NetworkPolicies ship in occludra-deployment.yaml and cover this
# Deployment via the empty podSelector.
#
# Mesh identity: `vigil.<mesh-domain>` (NetBird peer name `vigil`).
# Non-mesh path: ClusterIP vigil-service:5000 for operators/smoke tests only.
# ---------------------------------------------------------------------------
# Scanner configuration — format of vigil-llm at the pinned commit
# f2b4c134d060bae81d29fad07003f3c657e63fc8 (the image deploy.sh builds from
# VIGIL_SRC_REPO@VIGIL_SRC_REF). At that commit the config is INI
# (configparser), read from /app/conf/server.conf — the path upstream's baked
# entrypoint passes to vigil-server.py. The [embedding] and [vectordb]
# sections MUST exist: Vigil always initializes both at boot.
#
# Input scanners enabled on the pinned commit's scan endpoint
# /analyze/prompt: transformer (prompt-injection classifier
# laiyer/deberta-v3-base-prompt-injection), yara (our rules from
# manifests/vigil-yara/, mounted at /app/yara-rules) and vectordb (embedding similarity, cosine distance
# threshold). The pinned commit has no `heuristics`/`canonical` scanners.
# output_scanners keep upstream's defaults; they only run on
# /analyze/response, which the evaluation path never calls.
#
# ENDPOINT NOTE: at this commit upstream serves /analyze/prompt (and
# /analyze/response) — there is NO bare /analyze route. The operator injects
# VIGIL_URL ending in /analyze/prompt and the runner parses this build's
# ResponseModel verdicts natively (detections = non-empty per-scanner
# "matches"); pass a custom VIGIL_URL only to override the host, keeping the
# /analyze/prompt suffix.
#
# EMBEDDING: model=intfloat/multilingual-e5-small — a local SentenceTransformer, so no
# OpenAI key is needed (upstream's `openai` profile requires one). Models
# download from HuggingFace at boot; the tmp emptyDir doubles as that cache.
# VECTOR DB: the vectordb scanner queries the distributed Chroma cluster
# (manifests/chroma/ — coordinator, log service, compactors, query nodes over
# MinIO) through the image's REST v2 client (images/vigil-llm/
# remote_vectordb.py), collections vigil_e5s_v3_whole / _sentence / _benign
# (our calibrated corpus, hack/vigil-corpus/) loaded by the vigil-corpus-loader Job. Upstream's local on-disk ChromaDB is
# not used. NetworkPolicy vigil-to-chroma (below) opens that one path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-server-conf
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
    app.kubernetes.io/component: prompt-scanner
data:
  server.conf: |
    # Vigil-LLM server configuration for vigil-llm@
    # f2b4c134d060bae81d29fad07003f3c657e63fc8 (INI / configparser format —
    # NOT YAML; older/newer upstream releases parse a different schema).
    [main]
    use_cache = true
    cache_max = 500

    [embedding]
    # Local SentenceTransformer embedder, downloaded from HuggingFace at boot.
    # It must be the model the corpus was built with: the vector client
    # checks the collections' metadata and an embedding probe, and fails
    # closed on a mismatch (hack/vigil-corpus/, decision 2026-10-21).
    model = intfloat/multilingual-e5-small

    [vectordb]
    # The corpus lives in the distributed Chroma (manifests/chroma/, loaded by
    # the vigil-corpus-loader Job) and is queried over REST v2
    # (images/vigil-llm/remote_vectordb.py). Required: if Chroma does not
    # answer, the scan answers 500 and the evaluation fails closed.
    # chroma-gateway checks a bearer token: the reader token reaches the
    # pod as env CHROMA_TOKEN (Secret chroma-reader, hack/chroma/deploy.sh).
    chroma_url = http://chroma-gateway.chroma.svc.cluster.local:8080
    token_env = CHROMA_TOKEN
    tenant = default_tenant
    database = default_database
    # Calibrated corpus (hack/vigil-corpus/vigil-corpus-e5s-v3.lock.json):
    # whole texts vs the whole chunk, single sentences vs each sentence of
    # it, each collection with its own calibrated threshold (metadata); a hit
    # must also be closer than the nearest benign tool/MCP-server text.
    collections = vigil_e5s_v3_whole
    sentence_collections = vigil_e5s_v3_sentence
    benign_collections = vigil_e5s_v3_benign
    timeout_s = 5
    n_results = 5
    # Upstream's local-database keys; unused while chroma_url is set.
    collection = vigil-local
    # Writable path: the container root filesystem is read-only; /tmp is an
    # emptyDir.
    db_dir = /tmp/vigil-vdb

    [auto_update]
    # Do not mutate the corpus from scan traffic — deterministic scans.
    enabled = false
    threshold = 3

    [scanners]
    input_scanners = transformer,yara,vectordb
    output_scanners = similarity,sentiment

    [scanner:yara]
    # Our rules (manifests/vigil-yara/, ConfigMap vigil-yara-rules created by
    # deploy.sh), not upstream's baked /app/data/yara. A YARA match is a
    # second opinion: the evaluator aborts only when the transformer agrees.
    rules_dir = /app/yara-rules

    [scanner:vectordb]
    # The vector client returns only neighbours already under their
    # collection's calibrated threshold; 2.0 (above any cosine distance)
    # keeps upstream's scanner from filtering a second time.
    threshold = 2.0

    [scanner:transformer]
    model = laiyer/deberta-v3-base-prompt-injection
    threshold = 0.98

    [scanner:similarity]
    threshold = 0.4

    [scanner:sentiment]
    threshold = 0.7
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
    app.kubernetes.io/component: prompt-scanner
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  # __VIGIL_REPLICAS__ / __VIGIL_MAX_UNAVAILABLE__ are substituted by
  # deploy.sh (VIGIL_REPLICAS / VIGIL_MAX_UNAVAILABLE, defaults 1 / 1: few
  # concurrent users, the HPA adds replicas under load). The vigil-llm image
  # loads its classifier models at boot and is memory-hungry per replica, so
  # rollouts replace the pod rather than surge a second one that could OOM a
  # small node (see ARCHITECTURE.md §5.2 — size for the pinned image's model
  # footprint). Big nodes: 2 / 0 for zero-downtime rollouts.
  replicas: __VIGIL_REPLICAS__
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: __VIGIL_MAX_UNAVAILABLE__
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-llm
        app.kubernetes.io/component: prompt-scanner
        security.eval.io/mesh-peer: vigil
    spec:
      priorityClassName: mcp-eval-critical
      topologySpreadConstraints:
      # Replicas must not pile onto one node: the PDB is satisfied even when
      # both replicas share a node, but real availability needs node spread.
      # ScheduleAnyway keeps single-node (kind/k0s dev) clusters schedulable.
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vigil-llm
      serviceAccountName: vigil
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        fsGroup: 10004
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: vigil-server-conf
        - name: yara-rules
          configMap:
            name: vigil-yara-rules
        - name: tmp
          emptyDir:
            # Doubles as the writable HOME: the HuggingFace model cache
            # (deberta-v3-base classifier + e5-small embedder + nltk data) and
            # the on-disk ChromaDB all land here at boot.
            sizeLimit: 2Gi
        - name: logs
          emptyDir:
            sizeLimit: 256Mi
        - name: netbird-state
          emptyDir:
            sizeLimit: 128Mi
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      containers:
        # ----------------------------------------------------------- scanner
        - name: vigil
          # Placeholder rewritten by deploy.sh (VIGIL_IMG): the default is
          # built from VIGIL_SRC_REPO@VIGIL_SRC_REF — upstream publishes no
          # vigil-llm image.
          image: ghcr.io/security-eval/vigil-llm:20260930
          imagePullPolicy: Always
          # Start the server directly (skip upstream's entrypoint dataset
          # loader): its 1536-dim ada-002 vectors never match the 384-dim
          # MiniLM embedder — the CAVEAT above — and re-streaming them took
          # ~6 min per start. Same verdicts, starts in seconds once cached.
          command: ["python", "vigil-server.py", "-c", "conf/server.conf"]
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            # Reader token for chroma-gateway ([vectordb] token_env). No
            # optional: without the Secret the pod does not start, instead of
            # starting and failing every scan with 401.
            - name: CHROMA_TOKEN
              valueFrom:
                secretKeyRef: {name: chroma-reader, key: token}
            # No VIGIL_CONF knob exists upstream: the image's baked entrypoint
            # runs `python vigil-server.py -c conf/server.conf` (WORKDIR /app)
            # and its dataset loader hardcodes /app/conf/server.conf — hence
            # the /app/conf mount below.
            - name: HOME
              value: /tmp
            # sentence-transformers 2.2.2's own model cache; on the tmp
            # emptyDir it survives container restarts within the pod.
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /tmp/st-cache
            # The HuggingFace cache must be set explicitly: the image's ENV
            # points HF_HOME at /cache/hf (the GPU node's hostPath), which
            # does not exist on this read-only root filesystem. Without a
            # writable cache the transformer scanner fails to load and
            # vigil-llm keeps serving with it silently disabled.
            - name: HF_HOME
              value: /tmp/hf
          volumeMounts:
            # Upstream reads /app/conf/server.conf (baked entrypoint
            # argument); the mount shadows the image's own conf/ siblings,
            # which are not read at runtime.
            - name: config
              mountPath: /app/conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # vigil-server.py opens logs/server.log relative to WORKDIR
            # /app; the emptyDir keeps that writable under
            # readOnlyRootFilesystem.
            - name: logs
              mountPath: /app/logs
            - name: yara-rules
              mountPath: /app/yara-rules
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10004
            runAsGroup: 10004
            # Vigil writes only to /tmp (model/vector-store caches) and
            # /app/logs (server.log).
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            # Classifier workloads (transformer classifier + e5-small embedder,
            # downloaded at boot) are CPU- and memory-hungry per replica; size
            # for the pinned image's model footprint and let the HPA
            # (CPU 70 %) add replicas.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3500Mi
          # Probes are version-agnostic tcpSocket checks on the REST port:
          # the pinned image is not publicly pullable, so no HTTP health
          # route could be verified empirically (upstream docs also document
          # no /health endpoint). The generous startupProbe absorbs slow
          # boots (model/corpus loading) without tripping liveness during
          # the ramp.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 2
        # ---------------------------------------------------- netbird (TUN)
        - name: netbird
          image: netbirdio/netbird@sha256:9d8480d87b7f7c10d67b820eecf332ecca5c2756792d4bdfa532182b4fc3005f
          imagePullPolicy: Always
          env:
            - name: NETBIRD_MANAGEMENT_URL
              value: "https://netbird.example.com:443"   # your management server
            - name: NETBIRD_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-auth
                  key: setup-key
            - name: NETBIRD_HOSTNAME
              value: vigil
          volumeMounts:
            - name: netbird-state
              mountPath: /var/lib/netbird
            - name: dev-net-tun
              mountPath: /dev/net/tun
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # A wedged netbird sidecar silently removes this pod from the mesh
          # with no other signal. Same check the netbird DaemonSet uses:
          # userspace socket OR TUN device present.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /var/run/netbird/wt0.sock || ip link show wt0"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /var/run/netbird/wt0.sock || ip link show wt0"]
            periodSeconds: 60
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-service
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
  annotations:
    security.eval.io/network-path: "cluster-local (fallback), mesh is primary"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vigil-llm
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vigil
  namespace: security-gateways
spec:
  # One pod at a time may go (drains, node-pressure moves). A percentage
  # minAvailable rounds up to every pod at one replica and blocks any drain.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
---
# Horizontal scaling of the inbound scanner: every untrusted payload
# (advertised surface, fuzz responses, probe outputs) of every run is POSTed
# here, so scanner load grows linearly with concurrent evaluation runs.
# Scale on CPU; Vigil does not self-limit — backpressure relies on this HPA
# plus the evaluator's 5xx retry/backoff. Requires metrics-server (deploy.sh
# installs it with AUTOSCALE_METRICS=1).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vigil
  minReplicas: __VIGIL_HPA_MIN__
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Evaluation traffic arrives in waves (runs start/end together); hold
      # capacity for a while before shedding replicas.
      stabilizationWindowSeconds: 300
---
# Vigil -> Chroma, the vectordb scanner's only path to its corpus.
# gateway-egress (occludra-deployment.yaml) lets security-gateways pods reach
# private addresses only on NetBird ports; this adds exactly chroma-gateway's
# port, for Vigil pods only (CPU and GPU variants). The matching ingress rule
# is allow-vigil-to-gateway in manifests/chroma/networkpolicy.yaml.
#
# LIQO NOTE (not solved here): when the GPU Vigil runs on the PC as a pod
# offloaded through Liqo, it executes in the PC's cluster. Neither this
# policy nor the chroma-side one applies to it there (they select pods of
# this cluster), and from the PC chroma_url must still resolve and route to
# chroma-gateway.chroma (Liqo service reflection/remapped CIDRs, or a
# reachable address over the tunnel), with the Chroma frontend accepting the
# remapped source address. That path needs its own rule on both sides.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigil-to-chroma
  namespace: security-gateways
  labels:
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [vigil-llm, vigil-llm-gpu]}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: chroma
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chroma-gateway
      ports:
        - protocol: TCP
          port: 8080
