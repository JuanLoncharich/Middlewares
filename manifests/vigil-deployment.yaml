# ---------------------------------------------------------------------------
# Vigil-LLM — inbound prompt-injection & jailbreak scanner.
#
# Every untrusted MCP payload (tool descriptions, initialize instructions,
# fuzz/probe responses) is POSTed by the evaluator to
# http://vigil-service:5000/analyze BEFORE it reaches any LLM prompt. Vigil
# runs heuristic pattern matching, YARA signatures and (optionally)
# transformer/embedding similarity classifiers and returns a verdict; a
# "blocked" verdict aborts the evaluation and marks the MCPEvaluationRun
# Failed with riskCategory=Malicious.
#
# Deployed in security-gateways (see occludra-deployment.yaml for the namespace
# rationale — the netbird sidecar needs CAP_NET_ADMIN). Namespace-wide ingress
# and egress NetworkPolicies ship in occludra-deployment.yaml and cover this
# Deployment via the empty podSelector.
#
# Mesh identity: `vigil.<mesh-domain>` (NetBird peer name `vigil`).
# Non-mesh path: ClusterIP vigil-service:5000 for operators/smoke tests only.
# ---------------------------------------------------------------------------
# Scanner configuration. Key layout mirrors vigil-llm's documented
# server.conf — verify against the image version you pin.
#
# VECTORS: the real vigil-llm runs its `vector` scanner against an embedded
# on-disk ChromaDB inside the container. This platform instead ships the
# DISTRIBUTED Chroma cluster (manifests/chroma/ — coordinator, log service,
# compactors, query nodes over MinIO) and the stub's vector scanner queries
# its frontend REST API with the same all-MiniLM-L6-v2 model as the loaded
# Vigil corpora. Set VIGIL_CHROMA_URL="" to disable the vector layer and
# fall back to pure heuristics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-server-conf
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
    app.kubernetes.io/component: prompt-scanner
data:
  server.conf: |
    # Vigil-LLM server configuration (basic profile).
    name: "vigil-server"

    rest:
      host: 0.0.0.0
      port: 5000

    # Scanner definitions. Each entry maps to a module under vigil/scanners/.
    scanners:
      # Fast regex/heuristic signatures — always on.
      heuristics:
        enabled: true
        patterns:
          - "signatures/heuristics/*.yml"

      # YARA rules shipped with the image (default security signatures).
      yara:
        enabled: true
        rules:
          - "signatures/yara/*.yar"

      # Canonical prompt-injection classifier (requires model download).
      # canonical:
      #   enabled: true

      # Embedding similarity against a known injection corpus.
      # transformer:
      #   enabled: true
      #   model: "instructionaldetection"
      # vector:
      #   enabled: true
      #   threshold: 0.8
      #
      # NOTE: the commented `vector` block above belongs to the REAL
      # vigil-llm image (embedded on-disk ChromaDB). The stub deployed here
      # instead queries the distributed Chroma cluster when
      # VIGIL_CHROMA_URL is set (see the Deployment env) — no on-disk
      # database and no PV needed for the vector path.

      # Response-similarity and sentiment scanners stay off for evaluations:
      # the runner feeds raw untrusted payloads, not model responses.
      sentiment:
        enabled: false

    logging:
      level: "INFO"
      # Do not persist scanned payloads: they are untrusted content.
      log_payloads: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
    app.kubernetes.io/component: prompt-scanner
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-llm
        app.kubernetes.io/component: prompt-scanner
        security.eval.io/mesh-peer: vigil
    spec:
      priorityClassName: mcp-eval-critical
      topologySpreadConstraints:
      # Replicas must not pile onto one node: the PDB is satisfied even when
      # both replicas share a node, but real availability needs node spread.
      # ScheduleAnyway keeps single-node (kind/k0s dev) clusters schedulable.
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vigil-llm
      serviceAccountName: vigil
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        fsGroup: 10004
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: vigil-server-conf
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: netbird-state
          emptyDir:
            sizeLimit: 128Mi
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
      containers:
        # ----------------------------------------------------------- scanner
        - name: vigil
          image: deadbits/vigil-llm:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: VIGIL_CONF
              value: /conf/server.conf
            - name: HOME
              value: /tmp
              # Some builds resolve the config path relative to CWD; both are
              # provided so either lookup succeeds.
            - name: VIGIL_CONFIG_PATH
              value: /conf/server.conf
              # Vector scanner -> distributed Chroma frontend (manifests/chroma/).
              # Unset/empty disables the layer; a dead cluster degrades the
              # verdict to heuristics with a 60s init-retry cooldown.
            - name: VIGIL_CHROMA_URL
              value: http://rust-frontend-service.chroma.svc.cluster.local:8000
            - name: VIGIL_VECTOR_THRESHOLD
              value: "0.45"
          volumeMounts:
            # subPath so the image's own conf/ siblings stay visible.
            - name: config
              mountPath: /conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10004
            runAsGroup: 10004
            # Vigil writes nothing outside /tmp; if your build writes compiled
            # caches next to the code, drop this to false.
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          # HTTP probes against the real /health route (stub and vigil-llm
          # both expose it): a hung scanner must fail its probes, which a
          # listening-socket check alone does not catch. The startupProbe
          # absorbs slow boots (the real image may load scanner corpora)
          # without tripping liveness during the ramp.
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            failureThreshold: 2
        # ---------------------------------------------------- netbird (TUN)
        - name: netbird
          image: netbirdio/netbird:latest
          imagePullPolicy: Always
          env:
            - name: NETBIRD_MANAGEMENT_URL
              value: "https://netbird.example.com:443"   # your management server
            - name: NETBIRD_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-auth
                  key: setup-key
            - name: NETBIRD_HOSTNAME
              value: vigil
          volumeMounts:
            - name: netbird-state
              mountPath: /var/lib/netbird
            - name: dev-net-tun
              mountPath: /dev/net/tun
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # A wedged netbird sidecar silently removes this pod from the mesh
          # with no other signal. Same check the netbird DaemonSet uses:
          # userspace socket OR TUN device present.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /var/run/netbird/wt0.sock || ip link show wt0"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /var/run/netbird/wt0.sock || ip link show wt0"]
            periodSeconds: 60
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-service
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
  annotations:
    security.eval.io/network-path: "cluster-local (fallback), mesh is primary"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vigil-llm
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vigil
  namespace: security-gateways
spec:
  # Percentage so the budget scales with the HPA (min 50% of N replicas).
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
---
# Horizontal scaling of the inbound scanner: every untrusted payload
# (advertised surface, fuzz responses, probe outputs) of every run is POSTed
# here, so scanner load grows linearly with concurrent evaluation runs.
# Scale on CPU; the stub's in-flight limiter (VIGIL_STUB_MAX_INFLIGHT)
# backpressures with 503+Retry-After until new replicas are Ready. Requires
# metrics-server (deploy.sh installs it with AUTOSCALE_METRICS=1).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vigil
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Evaluation traffic arrives in waves (runs start/end together); hold
      # capacity for a while before shedding replicas.
      stabilizationWindowSeconds: 300
