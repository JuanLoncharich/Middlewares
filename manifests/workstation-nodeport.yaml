# ---------------------------------------------------------------------------
# Workstation exposure — lets "programmer's computer" Docker containers on the
# host docker network reach the security gateways without port-forward hacks.
#
# The gateways' NetworkPolicies (occludra-deployment.yaml) default-deny
# ingress and only allow the service ports from inside security-gateways.
# kindnet enforces those policies (nftables NFQUEUE), so NodePort traffic
# from external docker containers is dropped unless explicitly allowed here.
#
# Scope deliberately tight: only the docker bridge subnet the kind cluster
# itself runs on (the `kind` network, 172.21.0.0/16 — adjust if your docker
# network differs), only the two gateway ports. This is the operator /
# smoke-test / workstation path, NOT the evaluation path: evaluation pods
# keep using the NetBird mesh and remain blocked from these ClusterIPs.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: occludra-np
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: occludra
  annotations:
    security.eval.io/network-path: "nodeport workstation access"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: occludra
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-np
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
  annotations:
    security.eval.io/network-path: "nodeport workstation access"
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vigil-llm
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nodeport-from-docker-workstations
  namespace: security-gateways
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Containers on the host docker network reaching the NodePorts land on
    # the pod ports post-DNAT with their original source IP preserved.
    - from:
        - ipBlock:
            cidr: 172.21.0.0/16
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5000
