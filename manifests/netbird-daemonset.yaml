# ---------------------------------------------------------------------------
# NetBird — WireGuard mesh / zero-trust overlay for the evaluation pipeline.
#
# Three wiring profiles, all enrolling against the SAME management server:
#
#   (1) DaemonSet  [this file]  — one netbird client per NODE in TUN mode.
#       Gives the cluster's trusted infrastructure (operator host, CI runners,
#       admin jump pods using hostNetwork) a wt0 interface and mesh identity.
#       Optional: the platform works with profiles (2)+(3) alone.
#
#   (2) Userspace sidecar in EVERY evaluation pod — generated by the
#       MCPEvaluationRun controller (internal/controller/
#       mcpevaluationrun_controller.go, buildNetBirdSidecar). Runs WITHOUT
#       capabilities (PodSecurity restricted-safe) using netbird's userspace
#       stack:
#             NETBIRD_USERSPACE_HOSTWIRESOCK=yes
#         → netbird terminates WireGuard in userspace (netstack) and exposes
#           a local SOCKS5 proxy on 127.0.0.1:1080 shared through the pod
#           network namespace. The evaluator routes vigil/occludra traffic
#           through it (MESH_PROXY=socks5://127.0.0.1:1080); no TUN, no
#           NET_ADMIN, nothing for the untrusted target container to abuse.
#
#   (3) TUN-mode sidecar in the vigil / occludra Deployments — see
#       manifests/vigil-deployment.yaml and manifests/occludra-deployment.yaml.
#       Those pods own a wt0 interface (CAP_NET_ADMIN) so they are REACHABLE
#       mesh endpoints; the runner resolves them as `vigil` / `occludra`
#       peer names on the management server's DNS domain.
#
# Data path (mesh mode):
#   evaluator ──SOCKS5──▶ netbird sidecar ──WireGuard/UDP51820──▶ vigil|occludra wt0
#   …while the per-run NetworkPolicy denies every non-mesh destination.
#
# Enrollment uses a reusable, EPHEMERAL-peers setup key scoped in the NetBird
# admin console to a group that only has policies toward `vigil` and
# `occludra`. NEVER reuse an admin-grade key here: every evaluation pod
# enrolls with it and is destroyed minutes later.
# ---------------------------------------------------------------------------
# Enrollment secret for all platform netbird clients. deploy.sh creates this
# from $NETBIRD_SETUP_KEY. To create manually:
#   kubectl -n security-gateways create secret generic netbird-auth \
#     --from-literal=setup-key=<SETUP-KEY>
#   kubectl -n mcp-evals        create secret generic netbird-auth \
#     --from-literal=setup-key=<SETUP-KEY>
---
# Management server address used by every profile. Override via
# `kubectl patch configmap netbird-config -n security-gateways` or deploy.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-config
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: netbird
data:
  management-url: "https://netbird.example.com:443"
---
# (1) Node-level client. hostNetwork + NET_ADMIN + /dev/net/tun: this is a
# TRUSTED component on the host network — do not copy this pattern to pods
# running untrusted code.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-node
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/component: mesh-client
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: netbird
      app.kubernetes.io/component: mesh-client
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbird
        app.kubernetes.io/component: mesh-client
        security.eval.io/mesh-peer: node
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: netbird
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      # Keep the client off workloads' nodes if you prefer; by default run
      # everywhere so the mesh is uniformly reachable.
      tolerations:
        - operator: Exists
      volumes:
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: state
          hostPath:
            path: /var/lib/netbird
            type: DirectoryOrCreate
      containers:
        - name: netbird
          image: netbirdio/netbird:latest
          imagePullPolicy: Always
          env:
            - name: NETBIRD_MANAGEMENT_URL
              valueFrom:
                configMapKeyRef:
                  name: netbird-config
                  key: management-url
            - name: NETBIRD_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-auth
                  key: setup-key
            # Node peers are long-lived; name them per node.
            - name: NETBIRD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN"]
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # No livenessProbe: netbird exposes no health endpoint in TUN mode
          # and tcpSocket cannot probe a UDP data port. The startupProbe below
          # plus the DaemonSet rollout status are the health signals.
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "test -S /var/run/netbird/wt0.sock || ip link show wt0"]
            periodSeconds: 10
            failureThreshold: 30
      # `ip link show wt0` requires iproute2 in the image; if the pinned image
      # lacks it, replace the startupProbe with `netbird status` checking for
      # "Connected: true".
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbird
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: netbird
# ---------------------------------------------------------------------------
# REFERENCE — profile (2): userspace sidecar the controller injects into every
# evaluation pod. Shown here for review/diffing; the authoritative generator is
# buildNetBirdSidecar() in internal/controller/mcpevaluationrun_controller.go.
#
#   - name: netbird
#     image: netbirdio/netbird:latest
#     imagePullPolicy: Always
#     env:
#       - name: NETBIRD_MANAGEMENT_URL
#         value: "https://netbird.example.com:443"
#       - name: NETBIRD_SETUP_KEY
#         valueFrom:
#           secretKeyRef:
#             name: netbird-auth          # in mcp-evals
#             key: setup-key
#       - name: NETBIRD_HOSTNAME          # unique ephemeral peer
#         valueFrom:
#           fieldRef:
#             fieldPath: metadata.name
#       - name: NETBIRD_USERSPACE_HOSTWIRESOCK   # userspace netstack + local proxy
#         value: "yes"
#     volumeMounts:
#       - name: netbird-state             # emptyDir
#         mountPath: /var/lib/netbird
#     securityContext:                    # NO capabilities — restricted-safe
#       runAsNonRoot: true
#       readOnlyRootFilesystem: true
#       allowPrivilegeEscalation: false
#       capabilities:
#         drop: ["ALL"]
#       seccompProfile:
#         type: RuntimeDefault
#
# The SOCKS5 endpoint it exposes (127.0.0.1:1080) is reachable only inside the
# pod's network namespace. The untrusted target container shares that
# namespace, so the NetBird ACLs attached to the setup key's group are the
# enforcement layer: scope that group to vigil + occludra ONLY.
# ---------------------------------------------------------------------------
