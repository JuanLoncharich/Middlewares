# ---------------------------------------------------------------------------
# In-cluster container registry — removes the host-Docker registry SPOF.
#
# The local dev loop uses a host container (`kind-registry` on localhost:5001);
# that dies with the laptop session. This manifest runs the registry INSIDE
# the cluster so images survive host restarts and the pod can reschedule to
# any node. Intended for real (OpenStack) worker nodes; on kind the host
# registry remains the default because the node's containerd is pre-configured
# with its mirror.
#
# NODE CONFIG (one-time, per worker): the kubelet/containerd must be allowed
# to pull plain-HTTP from the Service. containerd hosts.toml:
#
#   [host."http://registry.registry.svc.cluster.local:5000"]
#     capability = ["pull", "resolve"]
#     skip_verify = true
#
# HA NOTES
#   - 1 replica + RWO PVC: no host SPOF, survives pod reschedule; the volume
#     is the remaining single point (acceptable for evaluations — a registry
#     outage delays pulls, it never corrupts a run; Jobs retry per status.retries).
#   - TRUE HA (2+ replicas): needs shared storage. On OpenStack point the
#     backend at Swift — uncomment REGISTRY_STORAGE block below and provision
#     the credentials Secret. The HTTP secret must then be shared (fixed value).
#   - Pull-through cache for third-party images (netbirdio/netbird,
#     deadbits/vigil-llm): uncomment REGISTRY_PROXY_REMOTEURL.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: registry
  labels:
    app.kubernetes.io/name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registry
  namespace: registry
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume: the new pod must take over after the old one exits
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      priorityClassName: mcp-eval-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: REGISTRY_HTTP_ADDR
              value: 0.0.0.0:5000
            # Required for basic hardening even single-replica; MUST be a
            # fixed value when scaling past 1 replica.
            - name: REGISTRY_HTTP_SECRET
              value: "mcp-eval-registry-http-secret"
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # ---- true-HA storage backend (OpenStack Swift) ----
            # - name: REGISTRY_STORAGE
            #   value: swift
            # - name: REGISTRY_STORAGE_SWIFT_AUTHURL
            #   valueFrom: { secretKeyRef: { name: registry-swift, key: authurl } }
            # ... (username/password/container keys from the same Secret)
            # ---- pull-through cache for third-party images ----
            # - name: REGISTRY_PROXY_REMOTEURL
            #   value: https://registry-1.docker.io
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # /v2/ is the registry's own liveness route (200 on a healthy
          # service even unauthenticated).
          startupProbe:
            httpGet:
              path: /v2/
              port: 5000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
