apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: export-evaluation-telemetry
  namespace: mcp-evals
spec:
  podSelector:
    matchLabels:
      security.eval.io/role: evaluation-pod
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
    ports:
    - protocol: TCP
      port: 4318
