apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-observability
  namespace: security-gateways
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occludra
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
    ports:
    - protocol: TCP
      port: 4318
