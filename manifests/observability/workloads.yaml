apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/part-of: mcp-observability
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:13.2.3
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 30
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 5
          failureThreshold: 180
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
          value: 'false'
        - name: GF_PLUGINS_PREINSTALL_DISABLED
          value: 'true'
        - name: GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED
          value: 'true'
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config-0
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: config-1
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: config-2
          mountPath: /etc/grafana/dashboards
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: config-0
        configMap:
          name: grafana-datasources
      - name: config-1
        configMap:
          name: grafana-providers
      - name: config-2
        configMap:
          name: grafana-dashboard
      terminationGracePeriodSeconds: 30
  serviceName: grafana
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
