apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/part-of: mcp-observability
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 30
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          failureThreshold: 60
        args:
        - --config.file=/etc/prometheus/prometheus.yaml
        - --storage.tsdb.path=/data
        - --storage.tsdb.retention.time=15d
        - --storage.tsdb.retention.size=8GB
        - --web.enable-remote-write-receiver
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config-0
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: config-0
        configMap:
          name: prometheus-config
      terminationGracePeriodSeconds: 30
      serviceAccountName: prometheus
  serviceName: prometheus
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/part-of: mcp-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
