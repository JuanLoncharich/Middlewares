apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alloy
  namespace: observability
  labels:
    app.kubernetes.io/part-of: mcp-observability
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: grafana/alloy:v1.20.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 12345
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 10
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 30
          failureThreshold: 6
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          failureThreshold: 60
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/data
        - --server.http.listen-addr=0.0.0.0:12345
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config-0
          mountPath: /etc/alloy
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: config-0
        configMap:
          name: alloy-config
      terminationGracePeriodSeconds: 30
      serviceAccountName: alloy
  serviceName: alloy
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
