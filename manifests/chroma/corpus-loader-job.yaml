# ---------------------------------------------------------------------------
# Corpus loader Job — downloads Vigil's embedding corpora from HuggingFace
# (deadbits org) and pushes them into the distributed Chroma collections via
# the frontend REST API.
#
# No image of our own: stock python:alpine (pinned) runs load_corpus.py
# (stdlib only) from the ConfigMap vigil-corpus-loader, which
# hack/chroma/deploy.sh creates from images/vigil-corpus-loader/. So any
# cluster that can pull from Docker Hub can load the corpus — no registry
# push needed. It writes through chroma-gateway with the writer token
# (Secret chroma-auth). Idempotent: collections holding vectors are
# skipped (FORCE_LOAD=1 to reload); re-applying after a completed Job
# re-runs it only when the spec changes (deploy.sh deletes+recreates it).
#
# Corpus -> collection mapping (all-MiniLM-L6-v2, 384-dim):
#   deadbits/vigil-instruction-bypass-all-MiniLM-L6-v2 -> vigil_instruction_bypass
#   deadbits/vigil-jailbreak-all-MiniLM-L6-v2          -> vigil_jailbreak
#
# NetworkPolicy: the only pod in `chroma` allowed HTTPS egress is this Job
# (see networkpolicy.yaml).
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: vigil-corpus-loader
  namespace: chroma
  labels:
    app.kubernetes.io/name: vigil-corpus-loader
    app.kubernetes.io/part-of: chroma-distributed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-corpus-loader
        app.kubernetes.io/part-of: chroma-distributed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loader
          image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/load_corpus.py"]
          env:
            - name: CHROMA_URL
              value: http://chroma-gateway.chroma.svc.cluster.local:8080
            - name: CHROMA_TOKEN
              valueFrom:
                secretKeyRef: {name: chroma-auth, key: writer-token}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # 8800+ entries x 384 floats parsed in memory, plus batch state.
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: script
          configMap:
            name: vigil-corpus-loader
