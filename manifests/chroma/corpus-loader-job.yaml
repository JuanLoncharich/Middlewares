# ---------------------------------------------------------------------------
# Corpus loader Job — loads Vigil's calibrated corpus (vigil-corpus/1, built
# by hack/vigil-corpus/build_corpus.py, pinned by the sha256 in its lock file
# hack/vigil-corpus/*.lock.json) into Chroma through chroma-gateway.
#
# The script is load_corpus.py (stdlib only) from the ConfigMap
# vigil-corpus-loader, which hack/chroma/deploy.sh creates from
# images/vigil-corpus-loader/. The image is ours only to carry the data:
# images/vigil-corpus-loader/Dockerfile.corpus = the pinned python:alpine
# plus the corpus file at /corpus/ (deploy.sh builds and pushes it as
# $IMG_REGISTRY/vigil-corpus:<name>-<sha12>; __VIGIL_CORPUS_IMG__,
# __CORPUS_FILE__ and __CORPUS_SHA256__ are filled in by hack/chroma/deploy.sh).
# The loader checks the file's sha256 before writing anything. It writes with
# the writer token (Secret chroma-auth). Idempotent: collections already
# holding this build are skipped (FORCE_LOAD=1 to reload; another build under
# the same name is refused unless RECREATE=1).
#
# Collections (multilingual-e5-small, 384-dim, cosine), with their calibrated
# thresholds in the collection metadata:
#   vigil_<name>_whole     whole malicious texts
#   vigil_<name>_sentence  their single sentences
#
# NetworkPolicy: the only pod in `chroma` allowed HTTPS egress is this Job
# (see networkpolicy.yaml) — not needed for the calibrated corpus, which is
# in the image; kept for the legacy deadbits download (no CORPUS_URL).
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: vigil-corpus-loader
  namespace: chroma
  labels:
    app.kubernetes.io/name: vigil-corpus-loader
    app.kubernetes.io/part-of: chroma-distributed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-corpus-loader
        app.kubernetes.io/part-of: chroma-distributed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loader
          image: __VIGIL_CORPUS_IMG__
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/load_corpus.py"]
          env:
            - name: CHROMA_URL
              value: http://chroma-gateway.chroma.svc.cluster.local:8080
            - name: CHROMA_TOKEN
              valueFrom:
                secretKeyRef: {name: chroma-auth, key: writer-token}
            - name: CORPUS_URL
              value: file:///corpus/__CORPUS_FILE__
            - name: CORPUS_SHA256
              value: "__CORPUS_SHA256__"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # The compressed file (~150 MB) in memory, streamed line by line, plus batch state.
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: script
          configMap:
            name: vigil-corpus-loader
