# Enable after installing manifests/observability; keeps the existing Chroma receiver address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: chroma
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: chroma-distributed
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      batch:
    exporters:
      otlp/observability:
        endpoint: otel-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/observability]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/observability]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: export-chroma-telemetry
  namespace: chroma
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
    ports:
    - protocol: TCP
      port: 4317
