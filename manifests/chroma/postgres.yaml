# ---------------------------------------------------------------------------
# Postgres — backing store of the Chroma SysDB coordinator catalog
# (tenants, databases, collections, segment placement).
#
# Mirrors chroma's own k8s/test/postgres.yaml: user `chroma` / `chroma`, two
# databases `sysdb` (coordinator catalog, migrated by the chart's
# sysdb-migration Job) and `log` (kept for parity with chroma's dev stack).
#
# `strategy: Recreate` pairs with the RWO PVC: a rolling update would hang
# the new pod waiting for the volume to detach.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: chroma
  labels:
    app.kubernetes.io/name: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: chroma
  labels:
    app.kubernetes.io/name: postgres
data:
  # The official image creates $POSTGRES_DB (sysdb) during initdb; the extra
  # catalog database `log` matches chroma's dev provisioning.
  create-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE log;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chroma
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: sysdb-catalog
    app.kubernetes.io/part-of: chroma-distributed
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: sysdb-catalog
        app.kubernetes.io/part-of: chroma-distributed
    spec:
      priorityClassName: mcp-eval-critical
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: chroma
            - name: POSTGRES_PASSWORD
              value: chroma
            - name: POSTGRES_DB
              value: sysdb
            # Subdir: the official image refuses to initdb into a non-empty
            # data dir (lost+found etc. live in the PVC root).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "chroma", "-d", "sysdb"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "chroma", "-d", "sysdb"]
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chroma
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
