# Container images. Pull requests build them (no push); pushes to main and
# v* tags push them to GHCR under the repository owner, tagged with the
# commit (sha-<7>) and, for tags, the tag name. Never :latest. Images are
# not signed (cosign is a separate decision).
#
# Not built here: the GPU Vigil (12 GB, hack/gpu-node/build-vigil-gpu.sh) and
# the corpus image (its data file is built locally, hack/vigil-corpus/).
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pin as deploy.sh (VIGIL_SRC_REPO / VIGIL_SRC_REF).
  VIGIL_SRC_REPO: https://github.com/deadbits/vigil-llm
  VIGIL_SRC_REF: f2b4c134d060bae81d29fad07003f3c657e63fc8

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mcp-eval-operator, context: ., file: Dockerfile}
          - {name: mcp-cloner, context: images/cloner, file: images/cloner/Dockerfile}
          - {name: mcp-target-sandbox, context: images/target, file: images/target/Dockerfile}
          - {name: mcp-evaluator, context: runner, file: runner/Dockerfile}
          - {name: occludra-gateway, context: images/occludra-gateway, file: images/occludra-gateway/Dockerfile}
          # The in-cluster Vigil is the CPU variant (deploy.sh builds it the same way).
          - name: vigil-llm
            context: vigil-src
            file: images/vigil-llm/Dockerfile
            vigil: true
            args: "TORCH_INDEX=https://download.pytorch.org/whl/cpu\nEXPECT_CUDA=0"
            contexts: vigil-patches=images/vigil-llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned Vigil source
        if: matrix.vigil
        run: |
          git init -q vigil-src
          git -C vigil-src fetch -q --depth 1 "$VIGIL_SRC_REPO" "$VIGIL_SRC_REF"
          git -C vigil-src checkout -q FETCH_HEAD
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          build-contexts: ${{ matrix.contexts }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
