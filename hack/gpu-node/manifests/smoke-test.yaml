# One-shot proof that a pod can use the GPU: `gpu-node smoke`.
apiVersion: v1
kind: Pod
metadata:
  name: gpu-smoke-test
  namespace: default
  labels: {purpose: temp-test}
spec:
  restartPolicy: Never
  runtimeClassName: nvidia
  activeDeadlineSeconds: 170
  nodeSelector:
    security.eval.io/gpu: nvidia
  tolerations:
    - {key: nvidia.com/gpu, operator: Equal, value: present, effect: NoSchedule}
  containers:
    - name: smi
      image: nvidia/cuda:12.8.1-base-ubuntu24.04
      command: ["nvidia-smi", "-L"]
      resources:
        limits: {nvidia.com/gpu: 1}
