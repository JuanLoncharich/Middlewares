# GPU variant of the Vigil scanner. Same code, six engines and SAME VERDICTS as
# `vigil`; the two deberta classifiers run on CUDA
# (images/vigil-stub/Dockerfile.gpu), about 8-10x faster per call and off the
# cluster's small CPUs.
#
# * Pinned to the on-demand GPU node by REQUIRED nodeAffinity + toleration.
#   `gpu-node up/down` scales it 1/0, so the cluster shows no Pending pod
#   when the PC is detached.
# * Has its OWN Service (vigil-gpu-service) and is NOT behind `vigil-service`:
#   mixing them would make coverage depend on which pod a request hit. The
#   evaluator prefers VIGIL_GPU_URL and falls back to the CPU vigil-service
#   when this one is unreachable (operator env VIGIL_GPU_URL).
# * No netbird sidecar: this variant is for MESH_ENFORCE=false (the k0s
#   cluster). In mesh mode the scanner needs its own mesh identity.
# * Memory limit leaves room for the k0s components inside the 4 GiB cap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-gpu
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm-gpu
    app.kubernetes.io/component: prompt-scanner-gpu
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  replicas: 0            # gpu-node up → 1, gpu-node down → 0
  strategy:
    type: Recreate       # one GPU: never run old and new side by side
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm-gpu
      app.kubernetes.io/component: prompt-scanner-gpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-llm-gpu
        app.kubernetes.io/component: prompt-scanner-gpu
    spec:
      runtimeClassName: nvidia
      priorityClassName: mcp-eval-critical
      serviceAccountName: vigil
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: security.eval.io/gpu
                    operator: In
                    values: ["nvidia"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        fsGroup: 10004
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      containers:
        - name: vigil
          image: __VIGIL_GPU_IMG__
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5000, protocol: TCP}
          env:
            - {name: HOME, value: /tmp}
            - {name: VIGIL_ORT_PROVIDER, value: cuda}
            - {name: VIGIL_ORT_CPU_MODELS, value: minilm}   # int8 MiniLM is slower on CUDA; keep it on CPU
            # Whole-payload windowed scores are report-only (they never change
            # a verdict) and OFF by default. To collect them for calibration:
            #   VIGIL_MAX_WINDOWS=192  VIGIL_VECTOR_MAX_WINDOWS=320
            # See images/vigil-stub/windowing.py for the measurements behind this.
            - {name: VIGIL_CHROMA_URL, value: "http://rust-frontend-service.chroma.svc.cluster.local:8000"}
            - {name: VIGIL_VECTOR_THRESHOLD, value: "0.45"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10004
            runAsGroup: 10004
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits:
              cpu: "2"
              memory: 2500Mi
              nvidia.com/gpu: 1
          startupProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 5
            failureThreshold: 90
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            periodSeconds: 10
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-gpu-service
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm-gpu
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vigil-llm-gpu
    app.kubernetes.io/component: prompt-scanner-gpu
  ports:
    - {name: http, port: 5000, targetPort: http, protocol: TCP}
