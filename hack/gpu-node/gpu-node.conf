# gpu-node defaults. Override by creating gpu-node.local.conf next to this file
# (git-ignored) or by exporting the variable before running gpu-node.

# --- cluster ---------------------------------------------------------------
KUBE_CONTEXT="${KUBE_CONTEXT:-k0s}"
NODE_NAME="${NODE_NAME:-pc-gpu}"
K0S_VERSION="${K0S_VERSION:-v1.35.4+k0s.0}"      # must match the cluster (kubectl get nodes)
GPU_NAMESPACE="${GPU_NAMESPACE:-security-gateways}"
GPU_DEPLOYMENT="${GPU_DEPLOYMENT:-vigil-gpu}"
# Image: built locally (docker build -f images/vigil-stub/Dockerfile.gpu ...), then
# imported straight into the PC's k0s containerd under the name the pod uses.
GPU_IMAGE_LOCAL="${GPU_IMAGE_LOCAL:-vigil-stub:gpu-local}"
GPU_IMAGE_REF="${GPU_IMAGE_REF:-ghcr.io/security-eval/vigil-stub:gpu}"

# --- network (ZeroTier network 565799d8f675597b) ----------------------------
ZT_IFACE="${ZT_IFACE:-ztr2q6zamn}"
ZT_SUBNET="${ZT_SUBNET:-10.147.17.0/24}"
NODE_LAN_SUBNET="${NODE_LAN_SUBNET:-10.66.50.0/24}"
# Cluster nodes: LAN address (what Calico advertises) -> ZeroTier address.
# VXLAN replies to a LAN address must go over ZeroTier, not the NAT gateway.
NODES_LAN=(10.66.50.249 10.66.50.25 10.66.50.59)
NODES_ZT=(10.147.17.3 10.147.17.98 10.147.17.228)

# --- join token (fetched once through the jump host; never printed) ---------
JUMP_HOST="${JUMP_HOST:-10.147.19.139}"          # laptop holding the SSH key
CONTROLLER_SSH="${CONTROLLER_SSH:-ubuntu@10.66.50.59}"
TOKEN_FILE="${TOKEN_FILE:-/etc/k0s/worker.token}"
TOKEN_EXPIRY="${TOKEN_EXPIRY:-24h}"

# --- resource limits for everything the node runs ----------------------------
CPU_CORES="${CPU_CORES:-4}"                      # -> CPUQuota=400%
MEM_LIMIT_GIB="${MEM_LIMIT_GIB:-4}"              # -> MemoryMax (hard), MemoryHigh (-0.5 GiB)
VRAM_LIMIT_BYTES="${VRAM_LIMIT_BYTES:-8589934592}"  # 8 GiB, soft cap via onnxruntime arena

# --- scheduling identity (applied by k0s on every start) ---------------------
NODE_LABEL="${NODE_LABEL:-security.eval.io/gpu=nvidia}"
NODE_TAINT="${NODE_TAINT:-nvidia.com/gpu=present:NoSchedule}"

# --- timeouts (seconds) ------------------------------------------------------
READY_TIMEOUT="${READY_TIMEOUT:-300}"
DRAIN_TIMEOUT="${DRAIN_TIMEOUT:-120}"
