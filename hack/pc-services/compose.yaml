# What the GPU PC serves to the k0s cluster, by API, over ZeroTier.
# Started and stopped by hack/pc-services/pc (never at boot); see README.md.
#
#   llm         llama.cpp's OpenAI-compatible server on the GPU (Gemma).
#               Occludra calls it with LOCAL_LLM_API_KEY.
#   vigil       the prompt-injection scanner, the same image and server.conf
#               the cluster used, reading its corpus from the Chroma below.
#               Not published: only vigil-auth reaches it.
#   chroma      single-node Chroma holding Vigil's corpus (240k vectors) on
#               this PC's disk. Chroma has no authentication, so it is not
#               published and sits on a network with no way out that only
#               Vigil and the loader join.
#   corpus-loader  one-off: fills that Chroma from the corpus image the
#               cluster uses (VIGIL_CORPUS_IMG in deploy/k0s/render.env),
#               sha256 checked against the lock. `pc up` runs it when needed.
#   vigil-auth  nginx in front of Vigil: bearer token + the two paths the
#               platform calls. The cluster's relay (manifests/vigil-remote.yaml)
#               sends the token.
#
# Secrets reach the containers as environment variables taken from `pc`'s
# environment (read from ~/.config/mcp-eval), never on a command line.
name: mcp-pc

services:
  llm:
    container_name: mcp-local-llm
    image: ghcr.io/ggml-org/llama.cpp@sha256:b0baccbe2e00b5d74e63f85f9f023c93d61d0f329475269e1e7002e87eb875ea
    restart: "no"
    ports:
      - "${PC_IP:?}:${LLM_PORT:-8080}:8080"
    environment:
      - LLAMA_API_KEY
    volumes:
      - "${LLM_MODEL_DIR:?}:/models:ro"
    command:
      - -m
      - /models/${LLM_MODEL_FILE:?}
      - --alias
      - ${LLM_MODEL_ALIAS:?}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${LLM_CTX:-65536}"
      - -ngl
      - "999"
      - --n-cpu-moe
      - "0"
      - --reasoning
      - auto
      - --reasoning-budget
      - "${LLM_REASONING_BUDGET:-0}"
      # Host-RAM caps. The weights and KV live in VRAM, but llama.cpp also
      # keeps prompt states in RAM: --cache-ram defaults to 8192 MiB, plus up
      # to 32 context checkpoints per slot (Gemma's SWA layers). With 30k-token
      # prompts that grew to several GiB, the 14 GiB PC filled up and
      # systemd-oomd SIGKILLed this container (Exited 137, OOMKilled=false).
      - --cache-ram
      - "${LLM_CACHE_RAM:-1024}"
      - --ctx-checkpoints
      - "${LLM_CTX_CHECKPOINTS:-8}"
      - --jinja
      - --no-webui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s

  vigil:
    image: ${VIGIL_IMAGE:?}
    restart: "no"
    # Start the server directly, skipping upstream's entrypoint dataset
    # loader, as the cluster did (a Kubernetes `command` replaces the
    # entrypoint; in compose that is `entrypoint`).
    entrypoint: ["python", "vigil-server.py", "-c", "conf/server.conf"]
    command: []
    # Your own user: the model cache below is a directory you own.
    user: "${PC_UID:?}:${PC_GID:?}"
    read_only: true
    depends_on:
      chroma:
        condition: service_healthy
    # default: vigil-auth, and the model download on first start.
    networks: [default, corpus]
    environment:
      - HOME=/tmp
      - SENTENCE_TRANSFORMERS_HOME=/cache/st
      - HF_HOME=/cache/hf
    volumes:
      - "${PC_RUN_DIR:?}/conf:/app/conf:ro"
      - "${PC_RUN_DIR:?}/yara-rules:/app/yara-rules:ro"
      - "${PC_CACHE_DIR:?}:/cache"
    tmpfs:
      - /tmp:size=1g
      - /app/logs:size=64m,uid=${PC_UID},gid=${PC_GID}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 4g
    cpus: 4
    healthcheck:
      # TCP, like the cluster's probes: upstream's /settings answers 500
      # (it reads vigil.config, which the pinned commit renamed).
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5000), 5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      # First start downloads the classifier and the embedder (~1.5 GB).
      start_period: 600s

  chroma:
    # The image and arguments of manifests/chroma/single.yaml.
    image: chromadb/chroma:1.5.10.dev296@sha256:f2faca1ab017d3a8afddf62f5b00251252c4a6ecc91c3e30a1f4c98fea58a0e9
    restart: "no"
    command: ["run", "--path", "/data", "--host", "0.0.0.0", "--port", "8000"]
    user: "${PC_UID:?}:${PC_GID:?}"
    read_only: true
    networks: [corpus]
    environment:
      - ANONYMIZED_TELEMETRY=False
    volumes:
      - "${PC_CHROMA_DIR:?}/data:/data"
    tmpfs:
      - /tmp:size=256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # ~570 MiB resident with the corpus loaded (manifests/chroma/single.yaml).
    mem_limit: 2g
    cpus: 2
    healthcheck:
      # The image has bash but no curl, wget or python.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 60s

  corpus-loader:
    # Only on request (`pc` runs it with `compose run`), never with `up`.
    profiles: ["load"]
    image: ${VIGIL_CORPUS_IMG:?}
    restart: "no"
    entrypoint: ["python", "/app/load_corpus.py"]
    command: []
    user: "65534:65534"
    read_only: true
    networks: [corpus]
    depends_on:
      chroma:
        condition: service_healthy
    environment:
      - CHROMA_URL=http://chroma:8000
      - CORPUS_URL=file:///corpus/${VIGIL_CORPUS_FILE:?}
      - CORPUS_SHA256=${VIGIL_CORPUS_SHA256:?}
      # One corpus in the store: an older build's collections are deleted.
      - PRUNE_OTHER=1
    volumes:
      - "../../images/vigil-corpus-loader/load_corpus.py:/app/load_corpus.py:ro"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g

  vigil-auth:
    image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
    restart: "no"
    depends_on:
      vigil:
        condition: service_started
    ports:
      - "${PC_IP:?}:${VIGIL_PORT:-5000}:8080"
    environment:
      - VIGIL_API_TOKEN
    # An empty token would make "Bearer " the credential: refuse to start.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ "$${#VIGIL_API_TOKEN}" -ge 32 ] || { echo "vigil-auth: token missing or shorter than 32 chars" >&2; exit 1; }
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    read_only: true
    volumes:
      - "./vigil-auth.conf.template:/etc/nginx/templates/default.conf.template:ro"
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /tmp:uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  default:
    driver_opts:
      # The ZeroTier path to the cluster nodes loses packets above ~1228
      # bytes (measured with ping -M do, hack/gpu-node). Containers would
      # announce a 1460-byte MSS and TLS handshakes stalled; 1200 keeps
      # every segment under it.
      com.docker.network.driver.mtu: "1200"
  # Chroma's network: no route out of it and nothing published.
  corpus:
    internal: true
