---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: mcpevaluationruns.security.eval.io
spec:
  group: security.eval.io
  names:
    kind: MCPEvaluationRun
    listKind: MCPEvaluationRunList
    plural: mcpevaluationruns
    shortNames:
    - mcprun
    singular: mcpevaluationrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.serverRef
      name: Server
      type: string
    - jsonPath: .status.finalScore
      name: Score
      type: integer
    - jsonPath: .status.scoring.riskCategory
      name: Risk
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: MCPEvaluationRun is the Schema for the mcpevaluationruns API.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: MCPEvaluationRunSpec defines the desired state of MCPEvaluationRun.
            properties:
              agents:
                items:
                  type: string
                minItems: 1
                type: array
              serverRef:
                minLength: 1
                type: string
              timeoutSeconds:
                default: 900
                format: int32
                minimum: 60
                type: integer
            required:
            - agents
            - serverRef
            type: object
          status:
            description: MCPEvaluationRunStatus defines the observed state of MCPEvaluationRun.
            properties:
              agentResults:
                description: AgentResults maps agent name to its raw structured output.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              completionTime:
                format: date-time
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentAgent:
                type: string
              finalScore:
                format: int32
                type: integer
              findings:
                items:
                  description: Finding is a single normalized security finding.
                  properties:
                    agent:
                      type: string
                    description:
                      type: string
                    remediation:
                      type: string
                    severity:
                      enum:
                      - Critical
                      - High
                      - Medium
                      - Low
                      - Info
                      type: string
                    title:
                      type: string
                  required:
                  - agent
                  - severity
                  - title
                  type: object
                type: array
              jobName:
                type: string
              message:
                type: string
              phase:
                default: Pending
                enum:
                - Pending
                - Cloning
                - Running
                - Evaluating
                - Completed
                - Failed
                type: string
              retries:
                description: Retries counts how many times the controller recreated the Job after a transient infrastructure failure (eviction, node loss, image pull flake).
                format: int32
                maximum: 2
                minimum: 0
                type: integer
              scoring:
                description: ScoringBlock is the synthesized final scoring produced by the synthesis agent.
                properties:
                  reliabilityScore:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  riskCategory:
                    enum:
                    - Safe
                    - Caution
                    - Untrusted
                    - Malicious
                    - Unknown
                    type: string
                  safetyScore:
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  summary:
                    type: string
                required:
                - reliabilityScore
                - riskCategory
                - safetyScore
                type: object
              startTime:
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
