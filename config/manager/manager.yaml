apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: mcp-eval-operator
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: mcp-eval-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        image: ghcr.io/security-eval/mcp-eval-operator:latest
        imagePullPolicy: Always
        name: manager
        env:
        - name: CLONER_IMAGE
          value: ghcr.io/security-eval/mcp-cloner:latest
        - name: TARGET_IMAGE
          value: ghcr.io/security-eval/mcp-target-sandbox:latest
        - name: EVALUATOR_IMAGE
          value: ghcr.io/security-eval/mcp-evaluator:latest
        - name: RUNNER_SERVICE_ACCOUNT
          value: mcp-eval-runner
        - name: LLM_SECRET_NAME
          value: llm-provider-credentials
        - name: LLM_SECRET_KEY
          value: ANTHROPIC_API_KEY
        ports:
        - containerPort: 8443
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: probes
          protocol: TCP
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
