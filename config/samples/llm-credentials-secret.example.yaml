# Copy to llm-credentials-secret.yaml, fill in the key, and apply.
# The secret is mounted ONLY into the evaluator container (never the target).
apiVersion: v1
kind: Secret
metadata:
  name: llm-provider-credentials
  namespace: mcp-evals
type: Opaque
stringData:
  OPENCODE_API_KEY: "REPLACE_ME"
  # Optional: direct Anthropic key when agent providerID is "anthropic".
  # ANTHROPIC_API_KEY: "REPLACE_ME"
