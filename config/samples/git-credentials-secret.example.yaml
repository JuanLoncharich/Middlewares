# Optional: credentials for cloning private repositories.
# Reference it from MCPServer.spec.credentialsSecretRef. Only the cloner init
# container receives these values, via environment variables, and only for the
# duration of the clone.
apiVersion: v1
kind: Secret
metadata:
  name: github-clone-credentials
  namespace: mcp-evals
type: Opaque
stringData:
  username: "x-access-token"
  token: "REPLACE_ME"
