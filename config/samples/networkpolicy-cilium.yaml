# FQDN-pinned variant of networkpolicy.yaml for clusters running Cilium.
# Apply together with the `default-deny-all` and `target-deny-all` policies
# from networkpolicy.yaml, and instead of the two phase policies there.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: evaluation-pod-clone-phase-fqdn
  namespace: mcp-evals
spec:
  endpointSelector:
    matchLabels:
      security.eval.io/role: evaluation-pod
      security.eval.io/net-phase: clone
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: github.com
        - matchName: codeload.github.com
        - matchPattern: "*.githubusercontent.com"
        - matchName: gitlab.com
        - matchName: registry.npmjs.org
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        - matchName: proxy.golang.org
        - matchName: sum.golang.org
        - matchName: storage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: evaluation-pod-evaluate-phase-fqdn
  namespace: mcp-evals
spec:
  endpointSelector:
    matchLabels:
      security.eval.io/role: evaluation-pod
      security.eval.io/net-phase: evaluate
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: api.anthropic.com
              - matchName: opencode.ai
              - matchName: kubernetes.default.svc
              - matchPattern: "kubernetes.default.svc.*"
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toFQDNs:
        - matchName: api.anthropic.com
        - matchName: opencode.ai
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
