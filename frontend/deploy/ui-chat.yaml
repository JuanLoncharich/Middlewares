# The UI chat: an OpenCode server the UI talks to, whose only model provider
# is Occludra. Same egress path as the evaluation agents (OpenCode -> Occludra
# -> upstream LLM), minus the sandbox: nothing untrusted runs here, so it
# talks to Occludra over the cluster network instead of NetBird.
#
# Applied by deploy.sh with DEPLOY_UI=1 (DEPLOY_UI_CHAT=0 leaves it out).
# Placeholders: __EVALUATOR_IMG__ (the runner image, which ships the opencode
# CLI) and __OPENCODE_CONFIG__ (JSON rendered from LLM_PROVIDER / LLM_MODEL).
#
# Containment: every tool denied in the config, no ServiceAccount token,
# non-root, read-only root filesystem, ingress only from the UI pod and egress
# only to DNS and Occludra's inference port. Occludra records the chat's calls
# (header X-Occludra-Client: ui-chat) in its request journal, which the UI
# reads on port 8081; that port is opened to the UI pod only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-chat
  namespace: mcp-eval-ui
  labels:
    app.kubernetes.io/name: opencode-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencode-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencode-chat
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opencode
          image: __EVALUATOR_IMG__
          command: ["opencode", "serve", "--hostname=0.0.0.0", "--port=4096"]
          workingDir: /tmp/chat
          ports:
            - name: http
              containerPort: 4096
          env:
            - name: OPENCODE_CONFIG_CONTENT
              value: __OPENCODE_CONFIG__
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-chat
  namespace: mcp-eval-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opencode-chat
  ports:
    - name: http
      port: 4096
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opencode-chat
  namespace: mcp-eval-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opencode-chat
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-eval-ui
      ports:
        - { protocol: TCP, port: 4096 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security-gateways
          podSelector:
            matchLabels:
              app.kubernetes.io/name: occludra
      ports:
        - { protocol: TCP, port: 8080 }
---
# The UI pod's extra egress for the chat (NetworkPolicies add up with the
# mcp-eval-ui policy in mcp-eval-ui.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-eval-ui-chat
  namespace: mcp-eval-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-eval-ui
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opencode-chat
      ports:
        - { protocol: TCP, port: 4096 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security-gateways
          podSelector:
            matchLabels:
              app.kubernetes.io/name: occludra
      ports:
        - { protocol: TCP, port: 8081 }
---
# Occludra's side: inference from the chat pod, the journal from the UI pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occludra-from-ui-chat
  namespace: security-gateways
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occludra
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-eval-ui
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opencode-chat
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mcp-eval-ui
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-eval-ui
      ports:
        - { protocol: TCP, port: 8081 }
