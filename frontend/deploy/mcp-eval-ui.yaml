# Optional: the demo/live UI inside the cluster. Read-only by construction:
# the ServiceAccount can watch the eval CRs, read report ConfigMaps and the
# evaluator's log in mcp-evals, and nothing else (no exec, no Secrets).
# Access it with:
#   kubectl -n mcp-eval-ui port-forward svc/mcp-eval-ui 8787:80
#   open http://localhost:8787/?mode=live
apiVersion: v1
kind: Namespace
metadata:
  name: mcp-eval-ui
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-eval-ui
  namespace: mcp-eval-ui
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-eval-ui-reader
  namespace: mcp-evals
rules:
  - apiGroups: ["security.eval.io"]
    resources: ["mcpservers", "mcpevaluationruns", "opencodeagents"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-eval-ui-reader
  namespace: mcp-evals
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-eval-ui-reader
subjects:
  - kind: ServiceAccount
    name: mcp-eval-ui
    namespace: mcp-eval-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-eval-ui
  namespace: mcp-eval-ui
  labels:
    app.kubernetes.io/name: mcp-eval-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-eval-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-eval-ui
    spec:
      serviceAccountName: mcp-eval-ui
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        runAsGroup: 10003
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/security-eval/mcp-eval-ui:latest
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: NAMESPACE
              value: mcp-evals
            # Occludra redaction counts; remove to hide them.
            - name: PROM_URL
              value: http://prometheus.observability.svc.cluster.local:9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-eval-ui
  namespace: mcp-eval-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-eval-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Egress: DNS, the API server and Prometheus. Ingress: none from other pods
# (port-forward goes through the kubelet and is not affected).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-eval-ui
  namespace: mcp-eval-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-eval-ui
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 9090 }
