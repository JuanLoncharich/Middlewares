data:
  policy.yaml: "# Occludra egress policy.\n# Every field value in /v1/chat/completions requests is matched against\n# these\
    \ detectors before the request leaves the cluster.\nversion: 1\ndefault_action: redact        # redact | block | allow\n\
    redaction_token: \"[REDACTED]\"\ndetectors:\n  - name: email\n    type: regex\n    pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\\
    .[A-Za-z]{2,}'\n    action: redact\n  - name: us-ssn\n    type: regex\n    pattern: '\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b'\n\
    \    action: redact\n  - name: phone-intl\n    type: regex\n    pattern: '(\\+?[0-9][0-9()\\-\\s]{7,}[0-9])'\n    action:\
    \ redact\n  - name: iban\n    type: regex\n    pattern: '\\b[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}\\b'\n    action: redact\n\
    \  - name: api-key\n    # Sk-..., AKIA..., ghp_..., xox..., and generic high-entropy\n    # assignment-style secrets commonly\
    \ leaked by MCP tool output.\n    type: regex\n    pattern: '(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|xox[bpars]-[A-Za-z0-9-]{10,}|-----BEGIN\
    \ [A-Z ]*PRIVATE KEY-----)'\n    action: redact\n  - name: bearer-token\n    type: regex\n    pattern: '(?i)\\b(bearer|authorization)[:=\
    \ ]+[A-Za-z0-9._~+/=-]{16,}'\n    action: redact\n  - name: password-context\n    # Natural-language secret disclosure:\
    \ \"the password is X\", \"passwd:\n    # X\". Catches high-entropy strings no keyword-prefix detector sees.\n    type:\
    \ regex\n    pattern: '(?i)\\b(pass ?words?|passphrases?|passcodes?|passwd)\\b\\s*(?:is|are|:|=)\\s*\\S{6,}'\n    action:\
    \ redact\n  - name: secret-assignment\n    # Assignment-style disclosures of generic secrets: \"api key = X\",\n    #\
    \ \"secret: X\" (egress twin of vigil's credential-harvest pattern).\n    type: regex\n    pattern: '(?i)\\b(api[_ -]?keys?|secrets?|tokens?|credentials?)\\\
    b\\s*(?:is|are|:|=)\\s*\\S{8,}'\n    action: redact\n  - name: person-name-context\n    # Person names introduced by a\
    \ relationship role: \"customer, Richard\n    # Philips\". Bare names stay out of scope (too many false positives);\n\
    \    # the role word is the PII signal.\n    type: regex\n    pattern: '(?i)\\b(customers?|clients?|patients?|employees?|subscribers?|beneficiaries?)\\\
    s*,?\\s+(?:mr\\.?|mrs\\.?|ms\\.?|dr\\.?)?\\s*[A-Z][a-z]+\\s+[A-Z][a-z]+'\n    action: redact\n  - name: large-amount\n\
    \    # Financial magnitudes: 6+ digit bare amounts (\"1300201\") and\n    # comma-grouped amounts (\"1,300,201\"). Order\
    \ ids can collide; a\n    # security egress defaults to redact.\n    type: regex\n    pattern: '\\b[0-9]{6,}\\b|\\b[0-9]{1,3}(,[0-9]{3})+\\\
    b(\\.[0-9]{2})?'\n    action: redact\n  - name: currency-amount\n    type: regex\n    pattern: '(?:\\$|\u20AC|\xA3|USD|EUR)\\\
    s?[0-9][0-9,]*'\n    action: redact\nmodels:\n  # Model allowlist: requests for anything not listed are rejected with\n\
    \  # 403 before any upstream connection is attempted. NOTE: OpenCode\n  # addresses the upstream with the BARE model id\
    \ (the `provider/`\n  # prefix exists only inside agent specs), so patterns match bare ids.\n  allow:\n    - \"^lfm2\\\
    \\.5\\\\-24b\\\\-a2b$\"   # LLM_PROVIDER=local (deploy.sh)\n    # OpenCode Zen (free ids end in -free; paid ids like\n\
    \    # claude-sonnet-4-6) and Anthropic/OpenAI direct naming.\n    - \"^(claude|muse|grok|kimi|qwen|glm|deepseek|gemini|minimax|step)\"\
    \n    - \".*-free\"\n    - \"^o[1345]\"\n    - \"^gpt\"\n    # NVIDIA NIM ids carry the publisher prefix (z-ai/glm-5.3,\
    \ ...).\n    - \"^(z-ai|moonshotai|deepseek-ai|nvidia|meta|mistralai|qwen|openai|google)/\"\nlogging:\n  # Never persist\
    \ prompt content in gateway logs; count and classify only.\n  log_prompts: false\n  log_redactions: true\n"
