metadata:
  name: vigil-server-conf
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
    app.kubernetes.io/component: prompt-scanner
data:
  server.conf: "# Vigil-LLM server configuration for vigil-llm@\n# f2b4c134d060bae81d29fad07003f3c657e63fc8 (INI / configparser\
    \ format \u2014\n# NOT YAML; older/newer upstream releases parse a different schema).\n[main]\nuse_cache = true\ncache_max\
    \ = 500\n\n[embedding]\n# Local SentenceTransformer embedder, downloaded from HuggingFace at boot.\n# It must be the model\
    \ the corpus was built with: the vector client\n# checks the collections' metadata and an embedding probe, and fails\n\
    # closed on a mismatch (hack/vigil-corpus/, decision 2026-10-21).\nmodel = intfloat/multilingual-e5-small\n\n[vectordb]\n\
    # The corpus lives in the distributed Chroma (manifests/chroma/, loaded by\n# the vigil-corpus-loader Job) and is queried\
    \ over REST v2\n# (images/vigil-llm/remote_vectordb.py). Required: if Chroma does not\n# answer, the scan answers 500\
    \ and the evaluation fails closed.\n# chroma-gateway checks a bearer token: the reader token reaches the\n# pod as env\
    \ CHROMA_TOKEN (Secret chroma-reader, hack/chroma/deploy.sh).\nchroma_url = http://chroma-gateway.chroma.svc.cluster.local:8080\n\
    token_env = CHROMA_TOKEN\ntenant = default_tenant\ndatabase = default_database\n# Calibrated corpus (hack/vigil-corpus/vigil-corpus-e5s-v3.lock.json):\n\
    # whole texts vs the whole chunk, single sentences vs each sentence of\n# it, each collection with its own calibrated\
    \ threshold (metadata); a hit\n# must also be closer than the nearest benign tool/MCP-server text.\ncollections = vigil_e5s_v3_whole\n\
    sentence_collections = vigil_e5s_v3_sentence\nbenign_collections = vigil_e5s_v3_benign\ntimeout_s = 5\nn_results = 5\n\
    # Upstream's local-database keys; unused while chroma_url is set.\ncollection = vigil-local\n# Writable path: the container\
    \ root filesystem is read-only; /tmp is an\n# emptyDir.\ndb_dir = /tmp/vigil-vdb\n\n[auto_update]\n# Do not mutate the\
    \ corpus from scan traffic \u2014 deterministic scans.\nenabled = false\nthreshold = 3\n\n[scanners]\ninput_scanners =\
    \ transformer,yara,vectordb\noutput_scanners = similarity,sentiment\n\n[scanner:yara]\n# Our rules (manifests/vigil-yara/,\
    \ ConfigMap vigil-yara-rules created by\n# deploy.sh), not upstream's baked /app/data/yara. A YARA match is a\n# second\
    \ opinion: the evaluator aborts only when the transformer agrees.\nrules_dir = /app/yara-rules\n\n[scanner:vectordb]\n\
    # The vector client returns only neighbours already under their\n# collection's calibrated threshold; 2.0 (above any cosine\
    \ distance)\n# keeps upstream's scanner from filtering a second time.\nthreshold = 2.0\n\n[scanner:transformer]\nmodel\
    \ = laiyer/deberta-v3-base-prompt-injection\nthreshold = 0.98\n\n[scanner:similarity]\nthreshold = 0.4\n\n[scanner:sentiment]\n\
    threshold = 0.7\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
    app.kubernetes.io/component: prompt-scanner
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-llm
        app.kubernetes.io/component: prompt-scanner
        security.eval.io/mesh-peer: vigil
    spec:
      priorityClassName: mcp-eval-critical
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vigil-llm
      serviceAccountName: vigil
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10004
        runAsGroup: 10004
        fsGroup: 10004
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: vigil-server-conf
      - name: yara-rules
        configMap:
          name: vigil-yara-rules
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: logs
        emptyDir:
          sizeLimit: 256Mi
      containers:
      - name: vigil
        image: docker.io/jjhonson/vigil-llm:sha-1276e3f
        imagePullPolicy: Always
        command:
        - python
        - vigil-server.py
        - -c
        - conf/server.conf
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: CHROMA_TOKEN
          valueFrom:
            secretKeyRef:
              name: chroma-reader
              key: token
        - name: HOME
          value: /tmp
        - name: SENTENCE_TRANSFORMERS_HOME
          value: /tmp/st-cache
        - name: HF_HOME
          value: /tmp/hf
        volumeMounts:
        - name: config
          mountPath: /app/conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
        - name: yara-rules
          mountPath: /app/yara-rules
          readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 10004
          runAsGroup: 10004
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 3500Mi
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-service
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
  annotations:
    security.eval.io/network-path: cluster-local (fallback), mesh is primary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vigil-llm
  ports:
  - name: http
    port: 5000
    targetPort: http
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vigil
  namespace: security-gateways
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: vigil-llm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigil
  namespace: security-gateways
  labels:
    app.kubernetes.io/name: vigil-llm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vigil
  minReplicas: 1
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vigil-to-chroma
  namespace: security-gateways
  labels:
    app.kubernetes.io/part-of: mcp-eval-platform
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - vigil-llm
      - vigil-llm-gpu
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: chroma
      podSelector:
        matchLabels:
          app.kubernetes.io/name: chroma-gateway
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: occludra-egress-local-llm
  namespace: security-gateways
  labels:
    app.kubernetes.io/part-of: mcp-eval-platform
  annotations:
    security.eval.io/reason: 'LLM_PROVIDER=local: Occludra''s upstream is http://10.147.17.21:8080/v1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: occludra
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 10.147.17.21/32
    ports:
    - protocol: TCP
      port: 8080
