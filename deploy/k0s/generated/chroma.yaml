    \ 8388608 # 8MiB\n            rate_limiting_policy:\n              count_based_policy:\n                max_concurrent_requests:\
    \ 1000\n                bandwidth_allocation: [1.0]\n    topologies: []\nfn_consumer_service:\n  service_name: \"fn-consumer\"\
    \n  otel_endpoint: \"http://otel-collector.chroma.svc.cluster.local:4317\"\n  otel_filters:\n    - crate_name: \"worker\"\
