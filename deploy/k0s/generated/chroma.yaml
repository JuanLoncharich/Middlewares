    \ \u2014 passed via `helm template --set-file` to\n# rustLogService, compactionService, queryService, garbageCollector,\n\
    # rustSysdbService, workQueueService and fnConsumer, exactly like chroma's\n# own Tiltfile does.\n#\n# Vendored from chroma-core/chroma\
    \ main (30d701a4, 2026-09-23),\n# `rust/worker/chroma_config.yaml` (their single-region distributed profile).\n#\n# Hard-coded\
    \ names this file assumes (all provided by manifests/chroma/*):\n#   - namespace `chroma` (service short-names resolve\
    \ inside it)\n#   - sysdb.chroma:50051            (Go SysDB coordinator, chart)\n#   - rust-sysdb-service.chroma     (Rust\
    \ SysDB, chart)\n#   - rust-log-service.chroma       (WAL, chart)\n#   - work-queue-service.chroma     (chart)\n#   -\
    \ minio.chroma:9000             (S3, via credentials: \"Minio\" \u2014 the Rust\n#     storage client hard-codes access\
    \ key `minio` / secret `minio123` and\n#     force-path-style for this endpoint; also auto-creates the bucket)\n#   -\
    \ memberlist CustomResources in namespace `chroma` (chart renders them)\n#   - otel-collector.chroma:4317    (otel-collector.yaml)\n\
    # ---------------------------------------------------------------------------\n# Default configuration for query and compaction\
    \ service\n# In the long term, every service should have an entry in this file\n# and this can become the global configuration\
    \ file for Chroma\n# for now we nest it in the worker directory\nquery_service:\n  service_name: \"query-service\"\n \
    \ otel_endpoint: \"http://otel-collector.chroma.svc.cluster.local:4317\"\n  otel_filters:\n    - crate_name: \"worker\"\
    \n      filter_level: \"trace\"\n  my_port: 50051\n  sysdb:\n    grpc:\n      host: \"sysdb.chroma\"\n      port: 50051\n\
    \      connect_timeout_ms: 5000\n      request_timeout_ms: 5000\n  mcmr_sysdb:\n    grpc:\n      host: \"rust-sysdb-service.chroma\"\
    \n      port: 50051\n      connect_timeout_ms: 60000\n      request_timeout_ms: 60000\n  storage:\n    admission_controlled_s3:\n\
    \      s3_config:\n        bucket: \"chroma-storage\"\n        credentials: \"Minio\"\n        connect_timeout_ms: 5000\n\
    \        request_timeout_ms: 30000 # 1 minute\n        upload_part_size_bytes: 536870912 # 512MiB\n        download_part_size_bytes:\
    \ 8388608 # 8MiB\n      rate_limiting_policy:\n        count_based_policy:\n          max_concurrent_requests: 30\n  \
    \        bandwidth_allocation: [0.7, 0.3]\n  log:\n    grpc:\n      host: \"rust-log-service.chroma\"\n      port: 50051\n\
    \      connect_timeout_ms: 5000\n      request_timeout_ms: 60000 # 1 minute\n      memberlist_provider:\n        custom_resource:\n\
    \          kube_namespace: \"chroma\"\n          memberlist_name: \"rust-log-service-memberlist\"\n          queue_size:\
    \ 100\n  dispatcher:\n    num_worker_threads: 4\n    dispatcher_queue_size: 1000\n    worker_queue_size: 100\n    task_queue_limit:\
    \ 10000\n    active_io_tasks: 10000\n  blockfile_provider:\n    arrow:\n      block_manager_config:\n        max_block_size_bytes:\
    \ 8388608 # 8MB\n        block_cache_config:\n          disk:\n            dir: \"/cache/chroma/query-service/block-cache\"\
    \n            name: \"block_cache\"\n            # 1k blocks * 8MiB = 8GiB, this is actually ignored in the disk cache\
    \ config. Leaving it set to 1k for consistency.\n            capacity: 1000\n            mem: 8000 # 8GiB\n          \
    \  disk: 12884 # 12GiB\n            file_size: 256 #  256 MiB\n            flushers: 4\n            flush: false\n   \
    \         reclaimers: 2\n            recover_concurrency: 16\n            admission_rate_limit: 256 # 256MiB/s\n     \
    \       shards: 64\n            eviction: lru\n        num_concurrent_block_flushes: 40\n      sparse_index_manager_config:\n\
    \        sparse_index_cache_config:\n          lru:\n            name: \"sparse_index_cache\"\n            capacity: 1000\n\
    \  hnsw_provider:\n    hnsw_temporary_path: \"~/tmp\"\n    hnsw_cache_config:\n      memory:\n        name: \"hnsw_cache\"\
    \n        capacity: 8589934592 # 8GB\n    permitted_parallelism: 180\n  spann_provider:\n    adaptive_search_nprobe: false\n\
    \    usearch_provider:\n      cache_config:\n        memory:\n          name: \"usearch_cache\"\n          capacity: 8192\
    \ # 8192 MiB = 8GB\n  bloom_filter_manager:\n    cache_config:\n      lru:\n        name: \"bloom_filter_cache\"\n   \
    \     capacity: 1000\n    enabled_collection_ids: [\"all\"]\n    storage_fetch_threshold: 100\n  fetch_log_batch_size:\
    \ 1000\n  bounded_wal_limit: 250\n  use_fragment_fetch: false\n  fragment_fetcher_cache:\n    memory:\n      capacity:\
    \ 100000000 # 100 MB\n  fragment_storage:\n    admission_controlled_s3:\n      s3_config:\n        bucket: \"chroma-storage\"\
    \n        credentials: \"Minio\"\n        connect_timeout_ms: 5000\n        request_timeout_ms: 30000\n        upload_part_size_bytes:\
    \ 536870912 # 512MiB\n        download_part_size_bytes: 8388608 # 8MiB\n      rate_limiting_policy:\n        count_based_policy:\n\
    \          max_concurrent_requests: 30\n          bandwidth_allocation: [0.7, 0.3]\ncompaction_service:\n  service_name:\
    \ \"compaction-service\"\n  otel_endpoint: \"http://otel-collector.chroma.svc.cluster.local:4317\"\n  otel_filters:\n\
    \    - crate_name: \"worker\"\n      filter_level: \"trace\"\n  my_member_id: \"compaction-service-0\"\n  my_port: 50051\n\
    \  assignment_policy:\n    rendezvous_hashing:\n      hasher: Murmur3\n  memberlist_provider:\n    custom_resource:\n\
    \      kube_namespace: \"chroma\"\n      memberlist_name: \"compaction-service-memberlist\"\n      queue_size: 100\n \
    \ sysdb:\n    grpc:\n      host: \"sysdb.chroma\"\n      port: 50051\n      connect_timeout_ms: 5000\n      request_timeout_ms:\
    \ 5000\n  mcmr_sysdb:\n    host: \"rust-sysdb-service.chroma\"\n    port: 50051\n    connect_timeout_ms: 60000\n    request_timeout_ms:\
    \ 60000\n  storage:\n    admission_controlled_s3:\n      s3_config:\n        bucket: \"chroma-storage\"\n        credentials:\
    \ \"Minio\"\n        connect_timeout_ms: 5000\n        request_timeout_ms: 60000 # 1 minute\n        upload_part_size_bytes:\
    \ 536870912 # 512MiB\n        download_part_size_bytes: 8388608 # 8MiB\n      rate_limiting_policy:\n        count_based_policy:\n\
    \          max_concurrent_requests: 30\n          bandwidth_allocation: [0.7, 0.3]\n  log:\n    grpc:\n      host: \"\
    rust-log-service.chroma\"\n      port: 50051\n      connect_timeout_ms: 5000\n      request_timeout_ms: 60000 # 1 minute\n\
    \      memberlist_provider:\n        custom_resource:\n          kube_namespace: \"chroma\"\n          memberlist_name:\
    \ \"rust-log-service-memberlist\"\n          queue_size: 100\n  # Sized for the 1536Mi limit on 4 GB nodes. Upstream's\
    \ values (8 GB caches,\n  # 50 concurrent jobs) are for big machines: with them the compactor was\n  # OOM-killed loading\
    \ the 240k-vector corpus, the log stopped being compacted\n  # and Chroma refused writes (HTTP 429 \"log needs compaction\"\
    ).\n  dispatcher:\n    num_worker_threads: 2\n    dispatcher_queue_size: 1000\n    worker_queue_size: 100\n    task_queue_limit:\
    \ 10000\n    active_io_tasks: 10000\n  compactor:\n    compaction_manager_queue_size: 1000\n    max_concurrent_jobs: 2\n\
    \    compaction_interval_sec: 10\n    min_compaction_size: 10\n    max_compaction_size: 10000\n    max_partition_size:\
    \ 5000\n    disabled_collections: [] # uuids to disable compaction for\n    fetch_log_batch_size: 1000\n  work_queue:\n\
    \    grpc:\n      host: \"work-queue-service.chroma\"\n      port: 50051\n      connect_timeout_ms: 10000\n      request_timeout_ms:\
    \ 10000\n  task_runner:\n    enabled: true\n  blockfile_provider:\n    arrow:\n      block_manager_config:\n        max_block_size_bytes:\
    \ 8388608 # 8MB\n        block_cache_config:\n          lru:\n            name: \"block_cache\"\n            capacity:\
    \ 32 # blocks of <= 8 MiB\n        num_concurrent_block_flushes: 4\n      sparse_index_manager_config:\n        sparse_index_cache_config:\n\
    \          lru:\n            name: \"sparse_index_cache\"\n            capacity: 64\n  bloom_filter_manager:\n    cache_config:\n\
    \      lru:\n        name: \"bloom_filter_cache\"\n        capacity: 1000\n    enabled_collection_ids: [\"all\"]\n   \
    \ storage_fetch_threshold: 100\n  hnsw_provider:\n    hnsw_temporary_path: \"~/tmp\"\n    hnsw_cache_config:\n      memory:\n\
    \        name: \"hnsw_cache\"\n        capacity: 256 # MiB\n    permitted_parallelism: 180\n  spann_provider:\n    pl_block_size:\
    \ 5242880 # 5MiB\n    pl_garbage_collection:\n      enabled: true\n      policy:\n        random_sample:\n          sample_size:\
    \ 0.1\n    hnsw_garbage_collection:\n      enabled: true\n      policy: \"full_rebuild\"\n    usearch_provider:\n    \
    \  cache_config:\n        memory:\n          name: \"usearch_cache\"\n          capacity: 256 # MiB\nwork_queue_service:\n\
    \  service_name: \"work-queue-service\"\n  my_port: 50051\n  otel_endpoint: \"http://otel-collector.chroma.svc.cluster.local:4317\"\
    \n  otel_filters:\n    - crate_name: \"worker\"\n      filter_level: \"trace\"\n  memberlist_provider:\n    custom_resource:\n\
