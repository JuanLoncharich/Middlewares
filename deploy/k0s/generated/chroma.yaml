apiVersion: apps/v1
kind: Deployment
metadata:
  name: sysdb
  namespace: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sysdb
  template:
    metadata:
      labels:
        app: sysdb
    spec:
      serviceAccountName: sysdb-serviceaccount
      containers:
      - command:
        - /bin/sh
        - -c
        - coordinator coordinator  --create-bucket-if-not-exists=true  --kubernetes-namespace=chroma  --s3-access-key-id=minio  --s3-endpoint=http://minio.chroma:9000  --s3-force-path-style=true  --s3-secret-access-key=minio123  --version-file-enabled=true
        env:
        - name: OPTL_TRACING_ENDPOINT
          value: otel-collector.chroma.svc.cluster.local:4317
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: chromadb/sysdb-service:dff1d8a
        imagePullPolicy: IfNotPresent
        readinessProbe:
          periodSeconds: 1
          failureThreshold: 30
          grpc:
            port: 50051
        name: sysdb
        ports:
        - containerPort: 50051
          name: grpc
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
