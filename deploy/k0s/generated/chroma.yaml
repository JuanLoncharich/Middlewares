apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-frontend-service-config
  namespace: chroma
data:
  config.yaml: "# ---------------------------------------------------------------------------\n# Chroma frontend (gateway)\
    \ configuration \u2014 passed via `helm template\n# --set-file rustFrontendService.configuration=...`.\n#\n# Vendored\
    \ from chroma-core/chroma main (30d701a4, 2026-09-23),\n# `rust/frontend/sample_configs/distributed.yaml` (the exact file\
    \ their\n# Tiltfile loads for single-region distributed deployments).\n# ---------------------------------------------------------------------------\n\
    # This file is an example of configuring the frontend for\n# distributed chroma. It is used in our Tiltfile as well.\n\
    open_telemetry:\n  service_name: \"rust-frontend-service\"\n  endpoint: \"http://otel-collector.chroma.svc.cluster.local:4317\"\
    \n  filters:\n    - crate_name: \"chroma_frontend\"\n      filter_level: \"trace\"\nsysdb:\n  grpc:\n    host: \"sysdb.chroma\"\
    \n    port: 50051\n    connect_timeout_ms: 60000\n    request_timeout_ms: 60000\ncollections_with_segments_provider:\n\
    \  cache:\n    lru:\n      name: \"collections_with_segments_cache\"\n      capacity: 1000\n  cache_ttl_secs: 2\n  permitted_parallelism:\
    \ 180\n  cache_invalidation_retry_policy:\n    delay_ms: 0\n    max_retries: 3\nlog:\n  grpc:\n    host: \"rust-log-service.chroma\"\
    \n    port: 50051\n    connect_timeout_ms: 5000\n    request_timeout_ms: 60000 # 1 minute\n    memberlist_provider:\n\
    \      custom_resource:\n        kube_namespace: \"chroma\"\n        memberlist_name: \"rust-log-service-memberlist\"\n\
    \        queue_size: 100\n\nexecutor:\n  distributed:\n    connections_per_node: 5\n    replication_factor: 2\n    connect_timeout_ms:\
    \ 5000\n    request_timeout_ms: 60000 # 1 minute\n    assignment:\n      rendezvous_hashing:\n        hasher: Murmur3\n\
    \    tiers:\n      - tier: 0\n        capacity: 4\n        patterns:\n          - all_of:\n              - tenant_id:\
    \ \"premium_tenant\"\n              - collection_size:\n                  min: 1000001\n                  max: 18446744073709551615\n\
    \      - tier: 1\n        capacity: 5\n        patterns:\n          - collection_size:\n              min: 0\n       \
    \       max: 10000\n    memberlist_provider:\n      custom_resource:\n        kube_namespace: \"chroma\"\n        memberlist_name:\
    \ \"query-service-memberlist\"\n        queue_size: 100\n    client_selection:\n      first_attempt_weights: [0.8, 0.2]\n\
    \      uniform_on_retry: true\nscorecard_enabled: true\nscorecard:\n  - patterns:\n      - \"op:read\"\n      - \"collection:*\"\
    \n    score: 10\n  - patterns:\n      - \"op:write\"\n      - \"collection:*\"\n    score: 10\ncircuit_breaker:\n  requests:\
    \ 1000\nenable_span_indexing: true\ndefault_knn_index: \"spann\"\nenable_schema: true\ntenants_to_migrate_immediately:\n\
    - \"default_tenant\"\ntenants_to_migrate_immediately_threshold: \"ffffffff-ffff-ffff-ffff-ffffffffffff\"\ntenants_with_quantization_enabled:\
    \ []\ntenants_with_maxscore_enabled: []\ntenants_with_token_bitmap_fts_enabled: []\ntenants_with_transactions_enabled:\n\
    - \"default_tenant\"\nenable_log_scouting: true\nenable_transactions: false\n"
