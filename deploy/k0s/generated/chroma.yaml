    app.kubernetes.io/part-of: chroma-distributed
data:
  default.conf.template: "# \"Bearer <64 hex chars>\" keys are longer than the default bucket.\nmap_hash_bucket_size 128;\n\
    map $http_authorization $chroma_role {\n  default                         none;\n  \"Bearer ${CHROMA_READER_TOKEN}\" reader;\n\
    \  \"Bearer ${CHROMA_WRITER_TOKEN}\" writer;\n}\nmap \"$chroma_role $request_method $request_uri\" $chroma_allow {\n \
    \ default 0;\n  \"~^writer \"                                                                                    1;\n\
    \  \"~^reader GET /api/v2/tenants/[A-Za-z0-9_-]+/databases/[A-Za-z0-9_-]+/collections/[A-Za-z0-9_-]+$\"        1;\n  \"\
    ~^reader POST /api/v2/tenants/[A-Za-z0-9_-]+/databases/[A-Za-z0-9_-]+/collections/[A-Za-z0-9-]+/query$\"  1;\n}\nserver\
    \ {\n  listen 8080;\n  server_tokens off;\n  # Loader batches: 500 x 384 floats as JSON is ~4 MB.\n  client_max_body_size\
    \ 16m;\n  proxy_read_timeout 120s;\n\n  location = /api/v2/heartbeat {\n    proxy_pass http://${CHROMA_UPSTREAM};\n  }\n\
    \  location = /healthz {\n    access_log off;\n    return 200 \"ok\\n\";\n  }\n  location / {\n    if ($chroma_role =\
    \ none) { return 401; }\n    if ($chroma_allow = 0)   { return 403; }\n    # The token stays here: Chroma never sees it.\n\
    \    proxy_set_header Authorization \"\";\n    proxy_pass http://${CHROMA_UPSTREAM};\n  }\n}\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma-gateway
  namespace: chroma
  labels:
    app.kubernetes.io/name: chroma-gateway
    app.kubernetes.io/part-of: chroma-distributed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chroma-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chroma-gateway
        app.kubernetes.io/part-of: chroma-distributed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
        command:
        - /bin/sh
        - -c
        args:
        - "for t in \"$CHROMA_READER_TOKEN\" \"$CHROMA_WRITER_TOKEN\"; do\n  [ \"${#t}\" -ge 32 ] || { echo \"chroma-gateway:\
          \ token shorter than 32 chars\" >&2; exit 1; }\ndone\n[ \"$CHROMA_READER_TOKEN\" != \"$CHROMA_WRITER_TOKEN\" ] ||\
          \ { echo \"chroma-gateway: reader and writer tokens are equal\" >&2; exit 1; }\nexec /docker-entrypoint.sh nginx\
          \ -g 'daemon off;'\n"
        env:
        - name: CHROMA_UPSTREAM
          value: rust-frontend-service:8000
        - name: CHROMA_READER_TOKEN
          valueFrom:
            secretKeyRef:
              name: chroma-auth
              key: reader-token
        - name: CHROMA_WRITER_TOKEN
          valueFrom:
            secretKeyRef:
              name: chroma-auth
              key: writer-token
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        volumeMounts:
        - name: templates
          mountPath: /etc/nginx/templates
          readOnly: true
        - name: confd
          mountPath: /etc/nginx/conf.d
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: templates
        configMap:
          name: chroma-gateway
      - name: confd
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-gateway
  namespace: chroma
  labels:
    app.kubernetes.io/name: chroma-gateway
    app.kubernetes.io/part-of: chroma-distributed
spec:
  selector:
    app.kubernetes.io/name: chroma-gateway
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: v1
data:
  load_corpus.py: "#!/usr/bin/env python3\n\"\"\"Load Vigil's embedding corpora (HuggingFace) into distributed Chroma.\n\n\
    Downloads the pre-embedded prompt corpora from the deadbits HF org and adds\nthem to collections on the Chroma distributed\
    \ frontend (REST v2). The\ndatasets carry precomputed `all-MiniLM-L6-v2` (384-dim) embeddings, so no\nembedding model\
    \ is needed here \u2014 only HTTP.\n\nTwo inputs:\n\nCORPUS_URL (+ CORPUS_SHA256, required with it): our calibrated corpus,\
    \ one\nvigil-corpus/1 file built by hack/vigil-corpus/build_corpus.py (gzip, JSON\nlines: a header, then {\"c\": collection,\
    \ \"t\": text, \"s\": source, \"e\":\nbase64 float16 vector}). The file is fetched (https:// or file://), its\nsha256\
    \ checked BEFORE anything is written, and each collection gets the\nheader's model, prefix, kind, threshold and embedding\
    \ probe as metadata \u2014\nthe remote Vigil client reads its thresholds from there and refuses a corpus\nits embedder\
    \ does not reproduce. Collection names carry the corpus name\n(e.g. vigil_e5s_v3_whole), so a new corpus never mixes with\
    \ an old one.\n\nWithout CORPUS_URL, the legacy deadbits corpora:\n\nCollections (defaults, overridable via env):\n  \
    \  vigil_instruction_bypass  <- deadbits/vigil-instruction-bypass-all-MiniLM-L6-v2\n    vigil_jailbreak           <- deadbits/vigil-jailbreak-all-MiniLM-L6-v2\n\
    \nPRUNE_OTHER=1 (calibrated corpus only): after a complete load, delete every\nother collection whose name starts with\
    \ vigil_ (an older corpus build, the\nlegacy deadbits corpora), so the vector store holds one corpus. Vigil only\nreads\
    \ the collections its server.conf names.\n\nIdempotent: a collection whose count is already > 0 is skipped unless\nFORCE_LOAD=1.\
    \ Designed to run as a K8s Job (manifests/chroma/corpus-loader-job.yaml);\nsafe to re-run on every deploy.\n\nAuth: CHROMA_URL\
    \ is chroma-gateway (manifests/chroma/gateway.yaml); the\nwriter token comes from CHROMA_TOKEN (a Secret) and is sent\
    \ only to\nCHROMA_URL, never to the dataset hosts.\n\nStdlib only (urllib/json) so the image stays python:alpine with\
    \ zero pip\ndependencies and works air-gapped except for the HF download itself.\n\"\"\"\n\nimport base64\nimport gzip\n\
    import hashlib\nimport io\nimport json\nimport struct\nimport os\nimport sys\nimport time\nimport urllib.error\nimport\
    \ urllib.request\n\nCHROMA_URL = os.environ.get(\"CHROMA_URL\", \"http://chroma-gateway.chroma.svc.cluster.local:8080\"\
    ).rstrip(\"/\")\nCHROMA_TOKEN = os.environ.get(\"CHROMA_TOKEN\", \"\")\nTENANT = os.environ.get(\"CHROMA_TENANT\", \"\
    default_tenant\")\nDATABASE = os.environ.get(\"CHROMA_DATABASE\", \"default_database\")\nFORCE = os.environ.get(\"FORCE_LOAD\"\
    , \"0\") == \"1\"\nRECREATE = os.environ.get(\"RECREATE\", \"0\") == \"1\"\nPRUNE_OTHER = os.environ.get(\"PRUNE_OTHER\"\
    , \"0\") == \"1\"\nBATCH = int(os.environ.get(\"BATCH_SIZE\", \"500\"))\nRETRIES = int(os.environ.get(\"RETRIES\", \"\
    8\"))\nTIMEOUT = int(os.environ.get(\"HTTP_TIMEOUT_S\", \"120\"))\n\nCORPORA = [\n    {\n        \"collection\": os.environ.get(\"\
    COLLECTION_INSTRUCTION_BYPASS\", \"vigil_instruction_bypass\"),\n        \"url\": os.environ.get(\n            \"CORPUS_INSTRUCTION_BYPASS_URL\"\
    ,\n            \"https://huggingface.co/datasets/deadbits/vigil-instruction-bypass-all-MiniLM-L6-v2/resolve/main/embeddings.json\"\
    ,\n        ),\n    },\n    {\n        \"collection\": os.environ.get(\"COLLECTION_JAILBREAK\", \"vigil_jailbreak\"),\n\
    \        \"url\": os.environ.get(\n            \"CORPUS_JAILBREAK_URL\",\n            \"https://huggingface.co/datasets/deadbits/vigil-jailbreak-all-MiniLM-L6-v2/resolve/main/embeddings.json\"\
    ,\n        ),\n    },\n]\n\nEXPECTED_DIM = 384  # all-MiniLM-L6-v2\nCORPUS_URL = os.environ.get(\"CORPUS_URL\", \"\")\n\
    CORPUS_SHA256 = os.environ.get(\"CORPUS_SHA256\", \"\").strip().lower()\n\n\ndef log(msg):\n    print(f\"[corpus-loader]\
    \ {msg}\", flush=True)\n\n\ndef request(method, url, payload=None, ok=(200, 201, 404, 409), timeout=TIMEOUT):\n    \"\"\
    \"HTTP with retry/backoff; returns (status, parsed-json-or-None).\"\"\"\n    data = json.dumps(payload).encode() if payload\
    \ is not None else None\n    headers = {\"Content-Type\": \"application/json\"} if data else {}\n    if CHROMA_TOKEN and\
    \ url.startswith(CHROMA_URL + \"/\"):\n        headers[\"Authorization\"] = f\"Bearer {CHROMA_TOKEN}\"\n    last_err =\
    \ None\n    for attempt in range(1, RETRIES + 1):\n        req = urllib.request.Request(url, data=data, headers=headers,\
    \ method=method)\n        try:\n            with urllib.request.urlopen(req, timeout=timeout) as resp:\n             \
    \   body = resp.read()\n                status = resp.status\n            parsed = None\n            if body:\n      \
    \          try:\n                    parsed = json.loads(body)\n                except ValueError:\n                 \
    \   parsed = body.decode(errors=\"replace\")\n            return status, parsed\n        except urllib.error.HTTPError\
    \ as err:\n            # HTTPError is a response: read it and honor the caller's ok-set.\n            status = err.code\n\
    \            try:\n                parsed = json.loads(err.read() or b\"null\")\n            except ValueError:\n    \
    \            parsed = None\n            if status in ok:\n                return status, parsed\n            last_err\
    \ = f\"HTTP {status}: {parsed}\"\n        except (urllib.error.URLError, OSError, TimeoutError) as err:\n            last_err\
    \ = str(err)\n        if attempt < RETRIES:\n            delay = min(2 ** attempt, 30)\n            log(f\"  retry {attempt}/{RETRIES}\
    \ for {method} {url} ({last_err}); sleeping {delay}s\")\n            time.sleep(delay)\n    raise RuntimeError(f\"{method}\
    \ {url} failed after {RETRIES} attempts: {last_err}\")\n\n\ndef wait_for_frontend():\n    status, parsed = request(\"\
    GET\", f\"{CHROMA_URL}/api/v2/version\", ok=tuple(range(200, 500)))\n    if status != 200:\n        raise RuntimeError(f\"\
    chroma frontend not healthy at {CHROMA_URL}: HTTP {status}\")\n    log(f\"frontend up, version={parsed}\")\n\n\ndef api(path):\n\
    \    return f\"{CHROMA_URL}/api/v2/tenants/{TENANT}/databases/{DATABASE}{path}\"\n\n\ndef get_or_create_collection(name,\
    \ metadata=None):\n    # Cosine space so the Vigil vector scanner's threshold (calibrated on\n    # cosine distance) applies\
    \ \u2014 chroma's default space (l2) would silently\n    # rescale it. The distributed frontend defaults to the SPANN\
    \ index;\n    # deployments with HNSW reject the spann config and vice versa, so try\n    # each shape and fall back to\
    \ the server default.\n    attempts = [\n        {\"spann\": {\"space\": \"cosine\"}},\n        {\"hnsw\": {\"space\"\
    : \"cosine\"}},\n        None,\n    ]\n    last = None\n    for configuration in attempts:\n        payload = {\"name\"\
    : name, \"get_or_create\": True}\n        if metadata:\n            payload[\"metadata\"] = metadata\n        if configuration:\n\
    \            payload[\"configuration\"] = configuration\n        status, coll = request(\"POST\", api(\"/collections\"\
    ), payload, ok=(200, 201, 400))\n        if status in (200, 201) and isinstance(coll, dict) and coll.get(\"id\"):\n  \
    \          which = \"spann\" if configuration and \"spann\" in configuration else (\"hnsw\" if configuration else \"server-default\"\
    )\n            log(f\"collection {name!r} id={coll['id']} (space=cosine via {which})\")\n            return coll[\"id\"\
    ]\n        last = coll\n    raise RuntimeError(f\"get_or_create {name!r} failed: {last}\")\n\n\ndef collection_count(coll_id):\n\
    \    # /count is a GET in the v2 API (openapi.json), even though add/query are POST.\n    status, count = request(\"GET\"\
    , api(f\"/collections/{coll_id}/count\"), ok=(200,))\n    return int(count)\n\n\ndef add_entries(coll_id, name, entries):\n\
    \    ids = []\n    embeddings = []\n    documents = []\n    metadatas = []\n    dim = None\n\n    def flush():\n     \
    \   if not ids:\n            return\n        status, resp = request(\n            \"POST\",\n            api(f\"/collections/{coll_id}/add\"\
    ),\n            {\"ids\": ids, \"embeddings\": embeddings, \"documents\": documents, \"metadatas\": metadatas},\n    \
    \        ok=(200, 201),\n        )\n        log(f\"  +{len(ids)} -> {name} (total pending flushed)\")\n        ids.clear();\
    \ embeddings.clear(); documents.clear(); metadatas.clear()\n\n    for i, entry in enumerate(entries):\n        text =\
    \ entry.get(\"text\")\n        vector = entry.get(\"embeddings\") or entry.get(\"embedding\")\n        if not text or\
    \ not vector:\n            log(f\"  skipping malformed entry {i}\")\n            continue\n        dim = dim or len(vector)\n\
    \        if len(vector) != dim:\n            raise RuntimeError(f\"{name}: inconsistent embedding dim at entry {i}: {len(vector)}\
    \ != {dim}\")\n        ids.append(f\"{name}-{i}\")\n        embeddings.append(vector)\n        documents.append(text)\n\
    \        metadatas.append({\"model\": entry.get(\"model\", \"all-MiniLM-L6-v2\"), \"source\": name, \"corpus_index\":\
    \ i})\n        if len(ids) >= BATCH:\n            flush()\n    flush()\n    if dim is not None and dim != EXPECTED_DIM:\n\
    \        log(f\"WARNING: {name} embedding dim is {dim}, expected {EXPECTED_DIM} (all-MiniLM-L6-v2)\")\n\n\ndef load_corpus(spec):\n\
    \    name = spec[\"collection\"]\n    log(f\"--- corpus {name} <- {spec['url']}\")\n    coll_id = get_or_create_collection(name)\n\
    \    existing = collection_count(coll_id)\n    if existing > 0 and RECREATE:\n        # Drop and re-create: needed e.g.\
    \ to change index configuration\n        # (vector space) of an already-loaded collection.\n        log(f\"RECREATE=1:\
    \ dropping {name!r} ({existing} vectors)\")\n        request(\"DELETE\", api(f\"/collections/{coll_id}\"), ok=(200, 204))\n\
    \        coll_id = get_or_create_collection(name)\n        existing = collection_count(coll_id)\n    if existing > 0 and\
    \ not FORCE:\n        log(f\"collection {name!r} already holds {existing} vectors; skipping (FORCE_LOAD=1 to reload)\"\
    )\n        return\n    if existing > 0 and FORCE:\n        log(f\"FORCE_LOAD=1: collection {name!r} has {existing} vectors;\
    \ adding anyway (ids are stable)\")\n\n    log(\"downloading corpus JSON...\")\n    status, parsed = request(\"GET\",\
    \ spec[\"url\"], ok=(200,), timeout=600)\n    if not isinstance(parsed, list):\n        raise RuntimeError(f\"{spec['url']}:\
    \ expected a JSON list, got {type(parsed).__name__}\")\n    log(f\"downloaded {len(parsed)} entries; adding in batches\
    \ of {BATCH}\")\n    add_entries(coll_id, name, parsed)\n    final = collection_count(coll_id)\n    log(f\"collection\
    \ {name!r} now holds {final} vectors\")\n\n\ndef fetch_verified(url, sha256):\n    \"\"\"The corpus file's bytes, only\
    \ if their sha256 is the pinned one.\"\"\"\n    if not sha256:\n        raise RuntimeError(\"CORPUS_URL needs CORPUS_SHA256\
    \ (the lock file's sha256)\")\n    log(f\"downloading {url} ...\")\n    with urllib.request.urlopen(url, timeout=600)\
    \ as resp:\n        data = resp.read()\n    got = hashlib.sha256(data).hexdigest()\n    if got != sha256:\n        raise\
    \ RuntimeError(f\"{url}: sha256 {got} != pinned {sha256}; refusing to load\")\n    log(f\"sha256 ok ({len(data) / 1e6:.0f}\
    \ MB)\")\n    return data\n\n\ndef collection_metadata(header, name, spec):\n    meta = {\n        \"vigil_corpus\": header[\"\
    name\"],\n        \"vigil_corpus_sha256\": CORPUS_SHA256,\n        \"vigil_embedding_model\": header[\"model\"],\n   \
    \     \"vigil_text_prefix\": header[\"prefix\"],\n        \"vigil_kind\": spec[\"kind\"],\n        \"vigil_threshold\"\
    : float(spec[\"threshold\"]),\n        \"vigil_probe_text\": header[\"probe_text\"],\n        \"vigil_probe_head\": json.dumps(header[\"\
    probe_head\"]),\n    }\n    # The trained head (corpus e5s-v3 on) rides on the whole-text collection,\n    # where Vigil's\
    \ client looks for it.\n    head = header.get(\"head\")\n    if head and spec[\"kind\"] == \"whole\":\n        meta.update({\n\
    \            \"vigil_head_w\": json.dumps(head[\"w\"]),\n            \"vigil_head_b\": float(head[\"b\"]),\n         \
    \   \"vigil_head_threshold\": float(head[\"threshold\"]),\n        })\n    return meta\n\n\ndef load_calibrated(url):\n\
    \    # Streamed: the decompressed file is several times the download.\n    lines = (line.decode() for line in gzip.GzipFile(fileobj=io.BytesIO(fetch_verified(url,\
    \ CORPUS_SHA256))))\n    header = json.loads(next(lines))\n    if header.get(\"format\") != \"vigil-corpus/1\":\n    \
    \    raise RuntimeError(f\"{url}: not a vigil-corpus/1 file: {str(header)[:200]}\")\n    dim = int(header[\"dim\"])\n\
    \    ids = {}\n    for name, spec in header[\"collections\"].items():\n        coll_id = get_or_create_collection(name,\
    \ collection_metadata(header, name, spec))\n        existing = collection_count(coll_id)\n        _, coll = request(\"\
    GET\", api(f\"/collections/{name}\"), ok=(200,))\n        held = (coll.get(\"metadata\") or {}).get(\"vigil_corpus_sha256\"\
    ) if isinstance(coll, dict) else None\n        if existing > 0 and held != CORPUS_SHA256 and not RECREATE:\n         \
    \   raise RuntimeError(f\"collection {name!r} holds another corpus build (sha256 {held}); RECREATE=1 replaces it\")\n\
    \        if existing > 0 and RECREATE:\n            log(f\"RECREATE=1: dropping {name!r} ({existing} vectors)\")\n   \
    \         request(\"DELETE\", api(f\"/collections/{coll_id}\"), ok=(200, 204))\n            coll_id = get_or_create_collection(name,\
    \ collection_metadata(header, name, spec))\n            existing = collection_count(coll_id)\n        if existing == spec[\"\
    count\"] and not FORCE:\n            log(f\"collection {name!r} already holds its {existing} vectors; skipping (FORCE_LOAD=1\
    \ to reload)\")\n            continue\n        if existing:\n            log(f\"collection {name!r} holds {existing} of\
    \ {spec['count']} vectors; adding (ids are stable)\")\n        ids[name] = coll_id\n    batches = {name: ([], [], [],\
    \ []) for name in ids}\n    counts = dict.fromkeys(ids, 0)\n\n    def flush(name):\n        b_ids, b_emb, b_doc, b_meta\
    \ = batches[name]\n        if b_ids:\n            # upsert: a re-run after a partial load rewrites the same ids\n    \
    \        request(\"POST\", api(f\"/collections/{ids[name]}/upsert\"),\n                    {\"ids\": b_ids, \"embeddings\"\
    : b_emb, \"documents\": b_doc, \"metadatas\": b_meta}, ok=(200, 201))\n            for part in batches[name]:\n      \
    \          part.clear()\n\n    for line in lines:\n        e = json.loads(line)\n        name = e[\"c\"]\n        if name\
    \ not in ids:\n            continue\n        raw = base64.b64decode(e[\"e\"])\n        if len(raw) != 2 * dim:\n     \
    \       raise RuntimeError(f\"{name}: vector of {len(raw) // 2} dims, header says {dim}\")\n        b_ids, b_emb, b_doc,\
    \ b_meta = batches[name]\n        b_ids.append(f\"{name}-{counts[name]}\")\n        b_emb.append(list(struct.unpack(f\"\
    <{dim}e\", raw)))\n        b_doc.append(e[\"t\"])\n        b_meta.append({\"source\": e[\"s\"]})\n        counts[name]\
    \ += 1\n        if len(b_ids) >= BATCH:\n            flush(name)\n            if counts[name] % (BATCH * 40) == 0:\n \
    \               log(f\"  {name}: {counts[name]} / {header['collections'][name]['count']}\")\n    for name in ids:\n  \
    \      flush(name)\n        final = collection_count(ids[name])\n        want = header[\"collections\"][name][\"count\"\
    ]\n        if final != want:\n            raise RuntimeError(f\"collection {name!r} holds {final} vectors after loading,\
    \ expected {want}\")\n        log(f\"collection {name!r} now holds {final} vectors (threshold {header['collections'][name]['threshold']:.4f})\"\
    )\n    return set(header[\"collections\"])\n\n\ndef prune_other(keep):\n    \"\"\"Delete vigil_* collections that are\
    \ not part of the corpus just loaded.\"\"\"\n    _, colls = request(\"GET\", api(\"/collections?limit=1000\"), ok=(200,))\n\
    \    for c in colls or []:\n        name = c.get(\"name\", \"\")\n        if name.startswith(\"vigil_\") and name not\
    \ in keep:\n            log(f\"PRUNE_OTHER=1: deleting {name!r} (not in this corpus)\")\n            request(\"DELETE\"\
    , api(f\"/collections/{name}\"), ok=(200, 204))\n\n\ndef main():\n    log(f\"chroma frontend: {CHROMA_URL} (tenant={TENANT}\
    \ database={DATABASE})\")\n    wait_for_frontend()\n    if CORPUS_URL:\n        keep = load_calibrated(CORPUS_URL)\n \
    \       log(\"calibrated corpus loaded\")\n        if PRUNE_OTHER:\n            prune_other(keep)\n        return\n  \
    \  failures = 0\n    for spec in CORPORA:\n        try:\n            load_corpus(spec)\n        except Exception as err:\
    \  # noqa: BLE001 - report every corpus, fail the job at the end\n            log(f\"ERROR loading {spec['collection']}:\
    \ {err}\")\n            failures += 1\n    if failures:\n        raise SystemExit(f\"{failures} corpus load(s) failed\"\
    )\n    log(\"all corpora loaded\")\n\n\nif __name__ == \"__main__\":\n    main()\n"
kind: ConfigMap
metadata:
  name: vigil-corpus-loader
  namespace: chroma
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vigil-corpus-loader
  namespace: chroma
  labels:
    app.kubernetes.io/name: vigil-corpus-loader
    app.kubernetes.io/part-of: chroma-distributed
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigil-corpus-loader
        app.kubernetes.io/part-of: chroma-distributed
    spec:
      priorityClassName: mcp-eval-batch
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: loader
        image: docker.io/jjhonson/vigil-corpus:e5s-v3-2d9653151abc
        imagePullPolicy: IfNotPresent
        command:
        - python
        - /app/load_corpus.py
        env:
        - name: CHROMA_URL
          value: http://chroma-gateway.chroma.svc.cluster.local:8080
        - name: CHROMA_TOKEN
          valueFrom:
            secretKeyRef:
              name: chroma-auth
              key: writer-token
        - name: CORPUS_URL
