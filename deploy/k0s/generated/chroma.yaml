    \    rendezvous_hashing:\n      hasher: Murmur3\n  sysdb:\n    grpc:\n      host: \"sysdb.chroma\"\n      port: 50051\n\
    \  storage:\n    admission_controlled_s3:\n      s3_config:\n        bucket: \"chroma-storage\"\n        credentials:\
    \ \"Minio\"\n        connect_timeout_ms: 5000\n        request_timeout_ms: 30000 # 1 minute\n        upload_part_size_bytes:\
    \ 536870912 # 512MiB\n        download_part_size_bytes: 8388608 # 8MiB\n      rate_limiting_policy:\n        count_based_policy:\n\
    \          max_concurrent_requests: 30\n          bandwidth_allocation: [0.7, 0.3]\n  work_queue:\n    storage_path: \"\
    workqueue_state.parquet\"\n    persistence:\n      time_threshold_seconds: 2\n      pending_threshold: 100\nlog_service:\n\
    \  num_records_before_backpressure: 100000\n  record_count_threshold: 10\n  reinsert_threshold: 0\n  suggested_compaction_threshold:\
