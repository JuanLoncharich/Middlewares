apiVersion: apps/v1
kind: Deployment
metadata:
  name: fn-consumer
  namespace: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fn-consumer
  template:
    metadata:
      labels:
        app: fn-consumer
        member-type: fn-consumer
    spec:
      serviceAccountName: fn-consumer-service-account
      volumes:
      - name: fn-consumer-config
        configMap:
          name: fn-consumer-config
      containers:
      - name: fn-consumer
        image: chromadb/fn-consumer-service:dff1d8a
        imagePullPolicy: IfNotPresent
        readinessProbe:
          periodSeconds: 1
          failureThreshold: 30
          grpc:
            port: 50051
        volumeMounts:
        - name: fn-consumer-config
          mountPath: /config/
        ports:
        - containerPort: 50051
          protocol: TCP
          name: grpc
        env:
        - name: CONFIG_PATH
          value: /config/config.yaml
        - name: RUST_BACKTRACE
          value: '1'
        - name: CHROMA_FN_CONSUMER_SERVICE__MY_MEMBER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 192Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            member-type: fn-consumer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-frontend-service
  namespace: chroma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-frontend-service
  template:
    metadata:
      labels:
        app: rust-frontend-service
    spec:
      serviceAccountName: rust-frontend-service-serviceaccount
      containers:
      - name: rust-frontend-service
        command:
        - chroma
        - run
        - $(CONFIG_PATH)
        image: chromadb/rust-frontend-service-oss:dff1d8a
        imagePullPolicy: IfNotPresent
        readinessProbe:
          periodSeconds: 1
          failureThreshold: 30
          httpGet:
            port: 8000
            path: /api/v2/healthcheck
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        env:
        - name: CONFIG_PATH
          value: /config/config.yaml
        - name: RUST_BACKTRACE
          value: '1'
        volumeMounts:
        - name: rust-frontend-service-config
          mountPath: /config/
      volumes:
      - name: rust-frontend-service-config
        configMap:
          name: rust-frontend-service-config
